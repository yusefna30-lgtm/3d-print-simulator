<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي طباعة الهودي الواقعي | عِزوة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0d0d0d;
            color: #f5f5f4;
            margin: 0;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(24, 22, 21, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-accent { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; color: #121212; }
        .size-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
            border-color: #D4AF37;
        }
        .angle-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
        }
        .color-dot.active {
            outline: 2px solid #D4AF37;
            outline-offset: 2px;
            transform: scale(1.15);
        }

        .mockup-stage {
            position: relative;
            width: min(84vw, 390px);
            height: min(50vh, 390px);
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            background-color: #000000;
        }
        .hoodie-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .color-overlay {
            position: absolute;
            inset: 0;
            mix-blend-mode: multiply;
            pointer-events: none;
            transition: background-color 0.3s ease;
        }
        .print-layer {
            position: absolute;
            transform: translate(-50%, -50%);
            mix-blend-mode: multiply;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(212, 175, 55, 0.55);
            border-radius: 2px;
            transition: width 0.25s ease, height 0.25s ease, border-color 0.2s ease;
        }
        .print-layer:hover, .print-layer.dragging {
            border: 1.5px dashed #D4AF37;
            background-color: rgba(212, 175, 55, 0.1);
        }
        .print-layer.on-dark {
            mix-blend-mode: normal;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative">

    <!-- الشريط العلوي -->
    <header class="w-full p-3 flex justify-between items-center z-20">
        <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg gold-bg flex items-center justify-center font-black text-sm">عِزوة</div>
            <div>
                <h1 class="text-xs sm:text-sm font-bold text-white leading-tight">محاكي طباعة الهودي</h1>
                <p class="text-[10px] text-stone-400">مقياس رسم هندسي دقيق 1:1</p>
            </div>
        </div>

        <div class="glass-panel p-1 rounded-xl flex gap-1">
            <button id="ang-front" onclick="setAngle('front')" class="angle-btn active px-2.5 py-1 rounded-lg text-[11px] transition">الأمام</button>
            <button id="ang-side_right" onclick="setAngle('side_right')" class="angle-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يمين</button>
            <button id="ang-back" onclick="setAngle('back')" class="angle-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">الظهر</button>
            <button id="ang-side_left" onclick="setAngle('side_left')" class="angle-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يسار</button>
        </div>
    </header>

    <!-- منطقة العرض الوسطى -->
    <main class="flex-1 flex items-center justify-center w-full relative z-10 px-4">
        <div id="stage" class="mockup-stage cursor-grab active:cursor-grabbing">
            <img id="hoodie-img" src="front.jpg.jpg" alt="هودي" class="hoodie-img">
            <div id="color-tint" class="color-overlay" style="background-color: transparent;"></div>
            
            <!-- التصميم بمقياس رسم حقيقي -->
            <div id="print-box" class="print-layer" style="top: 35%; left: 58%; width: 4.3%; height: 4.3%;" title="اسحب لتحريك مكان التصميم">
                <img id="print-img" src="" alt="التصميم" class="w-full h-full object-contain pointer-events-none">
            </div>
        </div>

        <!-- أدوات الألوان ورفع التصميم وتوسيطه -->
        <div class="fixed left-3 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-2">
            <div class="glass-panel p-2 rounded-xl flex flex-col items-center gap-2">
                <span class="text-[9px] text-stone-400">اللون</span>
                <button onclick="setColor('transparent', 'أبيض', false, this)" class="color-dot active w-6 h-6 rounded-full bg-[#ffffff] border border-stone-500 transition" title="أبيض"></button>
                <button onclick="setColor('#262629', 'أسود مطفي', true, this)" class="color-dot w-6 h-6 rounded-full bg-[#18181b] border border-stone-500 transition" title="أسود"></button>
                <button onclick="setColor('#5e192c', 'عنابي داكن', true, this)" class="color-dot w-6 h-6 rounded-full bg-[#4a1525] border border-stone-500 transition" title="عنابي"></button>
                <button onclick="setColor('#d8cab3', 'بيج رملي', false, this)" class="color-dot w-6 h-6 rounded-full bg-[#d6cbb8] border border-stone-500 transition" title="بيج"></button>
                <button onclick="setColor('#3b473c', 'زيتي داكن', true, this)" class="color-dot w-6 h-6 rounded-full bg-[#2d362e] border border-stone-500 transition" title="زيتي"></button>
            </div>

            <label class="glass-panel p-2 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#D4AF37] transition text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span class="text-[9px] font-bold text-white leading-tight">ارفع<br>تصميمك</span>
                <input type="file" accept="image/*" class="hidden" onchange="uploadDesign(event)">
            </label>

            <button onclick="resetPosition()" class="glass-panel p-2 rounded-xl flex flex-col items-center justify-center hover:border-[#D4AF37] transition text-center" title="إعادة لمكانه الافتراضي">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <span class="text-[8px] font-bold text-stone-300">توسيط</span>
            </button>
        </div>
    </main>

    <!-- الشريط السفلي للمقاسات القياسية الحقيقية -->
    <footer class="w-full p-2.5 z-20">
        <div class="max-w-2xl mx-auto glass-panel rounded-2xl p-3 shadow-2xl">
            <div class="flex justify-between items-center mb-2">
                <span id="angle-sizes-title" class="text-xs font-bold text-white">مقاسات الأمام القياسية:</span>
                <span id="size-label" class="text-[11px] gold-accent font-bold">شعار صدر (5 × 5 سم)</span>
            </div>

            <div id="sizes-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-1.5 mb-2.5"></div>

            <button onclick="orderWhatsApp()" class="w-full py-2.5 rounded-xl gold-bg font-bold text-xs sm:text-sm flex items-center justify-center gap-2 hover:opacity-95 transition">
                <span>اعتماد المقاس والمكان والطلب عبر واتساب</span>
            </button>
        </div>
    </footer>

    <script>
        function initDefaultLogo() {
            const c = document.createElement('canvas');
            c.width = 400; c.height = 400;
            const ctx = c.getContext('2d');
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 16;
            ctx.strokeRect(16, 16, 368, 368);
            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 90px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('عِـزوة', 200, 175);
            ctx.font = 'bold 34px Cairo, sans-serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('EZWA', 200, 265);
            document.getElementById('print-img').src = c.toDataURL();
        }
        initDefaultLogo();

        let currentAngle = 'front';
        let currentSizeIndex = 1;
        let currentColorName = 'أبيض';
        let customMoved = false;

        // معامل التحويل الهندسي الدقيق: عرض الهودي 56 سم = 48% من الإطار => 1 سم = 0.86%
        const CM_TO_PERCENT = 0.86;

        const imagesMap = {
            front:      'front.jpg.jpg',
            side_right: 'side_right.jpg.jpg',
            back:       'back.jpg.jpg',
            side_left:  'side_left.jpg.jpg'
        };

        const angleNames = {
            front:      'الأمام (الصدر)',
            side_right: 'الكم الأيمن',
            back:       'الخلف (الظهر)',
            side_left:  'الكم الأيسر'
        };

        // المقاسات بالسنتمتر الحقيقي (w_cm × h_cm)
        const angleSizes = {
            front: [
                { short: '3 × 3 سم',          label: 'شعار مصغّر (3 × 3 سم)',        top: '34%', left: '58%', w_cm: 3,    h_cm: 3 },
                { short: '5 × 5 سم',          label: 'شعار صدر جانبي (5 × 5 سم)',   top: '35%', left: '58%', w_cm: 5,    h_cm: 5 },
                { short: '8 × 8 سم',          label: 'شعار صدر بارز (8 × 8 سم)',    top: '36%', left: '57%', w_cm: 8,    h_cm: 8 },
                { short: '10 × 10 سم',        label: 'وسط الصدر (10 × 10 سم)',      top: '38%', left: '49%', w_cm: 10,   h_cm: 10 },
                { short: 'A6 (10.5×14.8)',    label: 'مقاس A6 صدر (10.5 × 14.8 سم)',top: '40%', left: '49%', w_cm: 10.5, h_cm: 14.8 },
                { short: 'A5 (14.8×21)',      label: 'مقاس A5 صدر (14.8 × 21 سم)',  top: '42%', left: '49%', w_cm: 14.8, h_cm: 21 },
                { short: '24 × 8 سم (عريض)',  label: 'صدر عريض (24 × 8 سم)',        top: '36%', left: '49%', w_cm: 24,   h_cm: 8 }
            ],
            back: [
                { short: '5 × 5 سم (ياقة)',   label: 'ظهر أسفل الياقة (5 × 5 سم)',   top: '32%', left: '49%', w_cm: 5,    h_cm: 5 },
                { short: '10 × 10 سم',        label: 'وسط الظهر العلوي (10 × 10 سم)',top: '37%', left: '49%', w_cm: 10,   h_cm: 10 },
                { short: 'A6 (10.5×14.8)',    label: 'مقاس A6 ظهر (10.5 × 14.8 سم)', top: '40%', left: '49%', w_cm: 10.5, h_cm: 14.8 },
                { short: 'A5 (14.8×21)',      label: 'مقاس A5 ظهر (14.8 × 21 سم)',   top: '43%', left: '49%', w_cm: 14.8, h_cm: 21 },
                { short: '20 × 25 سم',        label: 'ظهر متوسط (20 × 25 سم)',       top: '46%', left: '49%', w_cm: 20,   h_cm: 25 },
                { short: 'A4 (21×29.7)',      label: 'مقاس A4 ظهر (21 × 29.7 سم)',   top: '48%', left: '49%', w_cm: 21,   h_cm: 29.7 },
                { short: '30 × 40 سم (كامل)', label: 'ظهر كامل كبير (30 × 40 سم)',   top: '52%', left: '49%', w_cm: 30,   h_cm: 40 }
            ],
            side_right: [
                { short: '5 × 5 سم',          label: 'كم أيمن صغير (5 × 5 سم)',     top: '42%', left: '44%', w_cm: 5,    h_cm: 5 },
                { short: '8 × 8 سم',          label: 'كم أيمن قياسي (8 × 8 سم)',    top: '43%', left: '44%', w_cm: 8,    h_cm: 8 },
                { short: '10 × 10 سم',        label: 'كم أيمن كبير (10 × 10 سم)',   top: '44%', left: '44%', w_cm: 10,   h_cm: 10 },
                { short: '6 × 20 سم (طولي)',  label: 'كم أيمن طولي (6 × 20 سم)',    top: '49%', left: '44%', w_cm: 6,    h_cm: 20 }
            ],
            side_left: [
                { short: '5 × 5 سم',          label: 'كم أيسر صغير (5 × 5 سم)',     top: '42%', left: '53%', w_cm: 5,    h_cm: 5 },
                { short: '8 × 8 سم',          label: 'كم أيسر قياسي (8 × 8 سم)',    top: '43%', left: '53%', w_cm: 8,    h_cm: 8 },
                { short: '10 × 10 سم',        label: 'كم أيسر كبير (10 × 10 سم)',   top: '44%', left: '53%', w_cm: 10,   h_cm: 10 },
                { short: '6 × 20 سم (طولي)',  label: 'كم أيسر طولي (6 × 20 سم)',    top: '49%', left: '53%', w_cm: 6,    h_cm: 20 }
            ]
        };

        function renderSizesButtons() {
            const grid = document.getElementById('sizes-grid');
            const list = angleSizes[currentAngle];
            document.getElementById('angle-sizes-title').innerText = `مقاسات ${angleNames[currentAngle]} بالسنتمتر الحقيقي:`;

            grid.innerHTML = '';
            list.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `size-btn ${idx === currentSizeIndex ? 'active' : ''} px-2 py-1.5 rounded-xl border border-stone-700 text-[10px] sm:text-[11px] transition`;
                btn.innerText = item.short;
                btn.onclick = () => selectSize(idx);
                grid.appendChild(btn);
            });
        }

        function selectSize(idx) {
            currentSizeIndex = idx;
            customMoved = false;
            const list = angleSizes[currentAngle];
            const cfg = list[idx];

            document.querySelectorAll('.size-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });

            document.getElementById('size-label').innerText = cfg.label;
            const printBox = document.getElementById('print-box');
            printBox.style.top = cfg.top;
            printBox.style.left = cfg.left;
            printBox.style.width = (cfg.w_cm * CM_TO_PERCENT) + '%';
            printBox.style.height = (cfg.h_cm * CM_TO_PERCENT) + '%';
        }

        function setAngle(ang) {
            currentAngle = ang;
            const img = document.getElementById('hoodie-img');
            img.src = imagesMap[ang];

            document.querySelectorAll('.angle-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('text-stone-300');
            });
            const activeBtn = document.getElementById('ang-' + ang);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-stone-300');
            }

            currentSizeIndex = (ang === 'back') ? 4 : (ang === 'front') ? 1 : 1;
            if (currentSizeIndex >= angleSizes[ang].length) currentSizeIndex = 0;

            renderSizesButtons();
            selectSize(currentSizeIndex);
        }

        function resetPosition() {
            selectSize(currentSizeIndex);
        }

        function setColor(hex, name, isDark, btn) {
            currentColorName = name;
            document.getElementById('color-tint').style.backgroundColor = hex;
            
            const printBox = document.getElementById('print-box');
            if (isDark) {
                printBox.classList.add('on-dark');
            } else {
                printBox.classList.remove('on-dark');
            }

            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            btn.classList.add('active');
        }

        function uploadDesign(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('print-img').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function orderWhatsApp() {
            const cfg = angleSizes[currentAngle][currentSizeIndex];
            const faceName = angleNames[currentAngle];
            const posNote = customMoved ? ' (تم تحديد الموضع يدوياً على الهودي)' : '';
            const text = `السلام عليكم، جربت مقاس الطباعة على الهودي في المحاكي وأرغب باعتماد:\n- القطعة: هودي أوفر سايز\n- اللون: ${currentColorName}\n- الجهة: ${faceName}${posNote}\n- المقاس: ${cfg.label}`;
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        setAngle('front');

        const stage = document.getElementById('stage');
        const printBox = document.getElementById('print-box');
        let isDraggingPrint = false;
        let isSwipingStage = false;
        let startX = 0;
        const anglesOrder = ['front', 'side_right', 'back', 'side_left'];

        printBox.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            isDraggingPrint = true;
            printBox.classList.add('dragging');
        });

        stage.addEventListener('pointerdown', (e) => {
            if (isDraggingPrint) return;
            isSwipingStage = true;
            startX = e.clientX;
        });

        window.addEventListener('pointermove', (e) => {
            if (isDraggingPrint) {
                const rect = stage.getBoundingClientRect();
                let xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                let yPercent = ((e.clientY - rect.top) / rect.height) * 100;

                xPercent = Math.max(15, Math.min(85, xPercent));
                yPercent = Math.max(15, Math.min(85, yPercent));

                printBox.style.left = xPercent + '%';
                printBox.style.top = yPercent + '%';
                customMoved = true;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (isDraggingPrint) {
                isDraggingPrint = false;
                printBox.classList.remove('dragging');
            }
            if (isSwipingStage) {
                isSwipingStage = false;
                const diff = e.clientX - startX;
                if (Math.abs(diff) > 35) {
                    let idx = anglesOrder.indexOf(currentAngle);
                    if (diff < 0) idx = (idx + 1) % 4;
                    else idx = (idx - 1 + 4) % 4;
                    setAngle(anglesOrder[idx]);
                }
            }
        });
    </script>
</body>
</html>
