<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوديو المحاكاة والإنتاج | عِزوة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0d0d0d;
            color: #f5f5f4;
            margin: 0;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(24, 22, 21, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-accent { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; color: #121212; }
        .size-btn.active, .mode-btn.active, .prod-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
            border-color: #D4AF37;
        }
        .angle-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
        }
        .color-dot.active {
            outline: 2px solid #D4AF37;
            outline-offset: 2px;
            transform: scale(1.15);
        }

        .mockup-stage {
            position: relative;
            width: min(80vw, 350px);
            height: min(43dvh, 350px);
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            background-color: #000000;
        }
        .garment-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .color-overlay {
            position: absolute;
            inset: 0;
            mix-blend-mode: multiply;
            pointer-events: none;
            transition: background-color 0.3s ease;
        }

        .print-layer {
            position: absolute;
            transform: translate(-50%, -50%);
            mix-blend-mode: multiply;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px dashed rgba(212, 175, 55, 0.85);
            background-color: rgba(212, 175, 55, 0.04);
            border-radius: 2px;
            z-index: 10;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .print-layer.smooth-resize {
            transition: width 0.25s ease, height 0.25s ease, top 0.25s ease, left 0.25s ease, border-color 0.2s ease;
        }
        .print-layer.dragging {
            border: 1.5px solid #D4AF37;
            background-color: rgba(212, 175, 55, 0.1);
        }
        .print-layer.on-dark, .print-layer.transparent-bg {
            mix-blend-mode: normal;
        }
        .print-layer.on-dark {
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
        }

        .print-layer.clean-view {
            border-color: transparent !important;
            background-color: transparent !important;
        }
        .print-layer.clean-view .resize-handle,
        .print-layer.clean-view .live-cm-badge {
            opacity: 0;
            pointer-events: none;
        }

        .resize-handle {
            position: absolute;
            width: 13px;
            height: 13px;
            background-color: #D4AF37;
            border: 2px solid #121212;
            border-radius: 50%;
            z-index: 30;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .resize-handle:hover, .resize-handle:active {
            transform: scale(1.3);
            background-color: #ffffff;
        }
        .handle-nw { top: -6.5px; left: -6.5px; cursor: nwse-resize; }
        .handle-ne { top: -6.5px; right: -6.5px; cursor: nesw-resize; }
        .handle-sw { bottom: -6.5px; left: -6.5px; cursor: nesw-resize; }
        .handle-se { bottom: -6.5px; right: -6.5px; cursor: nwse-resize; }

        .live-cm-badge {
            position: absolute;
            top: -23px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.94);
            color: #D4AF37;
            border: 1px solid rgba(212, 175, 55, 0.6);
            padding: 0px 6px;
            border-radius: 5px;
            font-size: 9.5px;
            font-weight: 700;
            white-space: nowrap;
            pointer-events: none;
            direction: ltr;
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body class="w-screen flex flex-col justify-between items-center relative">

    <!-- الشريط العلوي: الشعار + اختيار القطعة (هودي / تيشيرت) + الزوايا -->
    <header class="w-full px-3 pt-2.5 pb-1 flex flex-wrap justify-between items-center gap-1.5 z-20 shrink-0">
        <div class="flex items-center gap-1.5">
            <div class="glass-panel px-2.5 py-1 rounded-xl flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg gold-bg flex items-center justify-center font-black text-xs">عِزوة</div>
                <div class="hidden sm:block">
                    <h1 class="text-xs font-bold text-white leading-tight">استوديو الطباعة</h1>
                    <p class="text-[9px] text-stone-400">معاينة وإنتاج</p>
                </div>
            </div>

            <div class="glass-panel p-1 rounded-xl flex gap-1">
                <button id="prod-hoodie" onclick="setProduct('hoodie')" class="prod-btn active px-2.5 py-1 rounded-lg text-[11px] transition">هودي</button>
                <button id="prod-tshirt" onclick="setProduct('tshirt')" class="prod-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">تيشيرت بوكسي</button>
            </div>
        </div>

        <div class="glass-panel p-1 rounded-xl flex gap-1">
            <button id="ang-front" onclick="setAngle('front')" class="angle-btn active px-2 py-1 rounded-lg text-[11px] transition">الأمام</button>
            <button id="ang-side_right" onclick="setAngle('side_right')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يمين</button>
            <button id="ang-back" onclick="setAngle('back')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">الظهر</button>
            <button id="ang-side_left" onclick="setAngle('side_left')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يسار</button>
        </div>
    </header>

    <!-- منطقة العرض الوسطى -->
    <main id="main-area" class="flex-1 flex flex-col items-center justify-center w-full relative z-10 px-4 min-h-0">

            <span id="dpi-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span id="dpi-text" class="text-stone-200 font-semibold">جودة التصميم: ممتازة للطباعة (300 DPI)</span>
        </div>

        <div id="stage" class="mockup-stage cursor-grab active:cursor-grabbing">
            <img id="garment-img" src="front.jpg.jpg" alt="القطعة" class="garment-img">
            <div id="color-tint" class="color-overlay" style="background-color: transparent;"></div>
            
            <div id="print-box" class="print-layer smooth-resize" style="top: 34%; left: 57%; width: 9.2%; height: 9.2%;">
                <div id="live-badge" class="live-cm-badge">8.0 × 8.0 cm</div>
                <img id="print-img" src="" alt="التصميم" class="w-full h-full object-contain pointer-events-none">
                
                <div class="resize-handle handle-nw" data-corner="nw"></div>
                <div class="resize-handle handle-ne" data-corner="ne"></div>
                <div class="resize-handle handle-sw" data-corner="sw"></div>
                <div class="resize-handle handle-se" data-corner="se"></div>
            </div>
        </div>

        <!-- أدوات التحكم الجانبية -->
        <div class="fixed left-3 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-1.5">
            <div class="glass-panel p-1.5 rounded-xl flex flex-col items-center gap-1.5">
                <span class="text-[9px] text-stone-400">اللون</span>
                <button onclick="setColor('transparent', 'أبيض', false, this)" class="color-dot active w-5 h-5 rounded-full bg-[#ffffff] border border-stone-500 transition" title="أبيض"></button>
                <button onclick="setColor('#262629', 'أسود مطفي', true, this)" class="color-dot w-5 h-5 rounded-full bg-[#18181b] border border-stone-500 transition" title="أسود"></button>
                <button onclick="setColor('#5e192c', 'عنابي داكن', true, this)" class="color-dot w-5 h-5 rounded-full bg-[#4a1525] border border-stone-500 transition" title="عنابي"></button>
                <button onclick="setColor('#d8cab3', 'بيج رملي', false, this)" class="color-dot w-5 h-5 rounded-full bg-[#d6cbb8] border border-stone-500 transition" title="بيج"></button>

            </div>

            <label class="glass-panel p-1.5 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#D4AF37] transition text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>

            </label>

            <button id="btn-remove-bg" onclick="toggleRemoveWhiteBg()" class="glass-panel p-1.5 rounded-xl flex flex-col items-center justify-center hover:border-[#D4AF37] transition text-center" title="إزالة الخلفية البيضاء من الشعار">
                <span class="text-xs mb-0.5">✨</span>
                <span id="bg-btn-text" class="text-[8px] font-bold text-stone-300 leading-tight">تفريغ<br>الأبيض</span>
            </button>

            <button id="btn-lock-ratio" onclick="toggleRatioLock()" class="glass-panel p-1.5 rounded-xl flex flex-col items-center justify-center border-[#D4AF37] transition text-center">
                <span id="lock-icon" class="text-[11px]">🔒</span>
                <span id="lock-text" class="text-[8px] font-bold gold-accent leading-tight">تناسب<br>مقفل</span>
            </button>

            <button onclick="resetPosition()" class="glass-panel p-1.5 rounded-xl flex flex-col items-center justify-center hover:border-[#D4AF37] transition text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>

        </div>
    </main>

    <!-- الشريط السفلي -->
    <footer class="w-full px-3 pb-2.5 pt-1 z-20 shrink-0">
        <div class="max-w-2xl mx-auto glass-panel rounded-2xl p-2.5 shadow-2xl">
            
            <div class="flex flex-wrap justify-between items-center gap-1.5 mb-1.5">
                <div class="flex bg-black/50 p-0.5 rounded-xl border border-stone-800">
                    <button id="tab-presets" onclick="switchMode('presets')" class="mode-btn active px-2.5 py-1 rounded-lg text-[11px] transition">مقاسات المطابع</button>
                    <button id="tab-free" onclick="switchMode('free')" class="mode-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">مقاس حر (سحب الزوايا)</button>
                </div>

                <div class="flex items-center gap-1.5 bg-black/40 px-2.5 py-1 rounded-lg border border-stone-800">
                    <span id="paper-name-label" class="text-[10.5px] text-stone-300">شعار صدر:</span>
                    <span id="size-label" class="text-[11px] gold-accent font-bold" dir="ltr">8.0 × 8.0 cm</span>
                </div>
            </div>

            <div id="presets-panel">
                <div id="sizes-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 mb-2"></div>
            </div>

            <div id="free-panel" class="hidden mb-2 bg-black/40 p-2 rounded-xl border border-stone-800">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                    <p class="text-[10.5px] text-stone-300">اسحب زوايا التصميم أو أدخل المقاس بالسنتيمتر:</p>
                    <div class="flex items-center gap-2" dir="ltr">
                        <div class="flex items-center gap-1">
                            <input id="input-w-cm" type="number" step="0.5" min="2" max="35" value="8" onchange="applyManualCm('w')" class="w-14 bg-stone-900 border border-stone-700 rounded-lg px-1.5 py-1 text-center text-xs text-white focus:border-[#D4AF37] outline-none">
                            <span class="text-[10px] text-stone-400">W</span>
                        </div>
                        <span class="text-stone-500 text-xs">×</span>
                        <div class="flex items-center gap-1">
                            <input id="input-h-cm" type="number" step="0.5" min="2" max="45" value="8" onchange="applyManualCm('h')" class="w-14 bg-stone-900 border border-stone-700 rounded-lg px-1.5 py-1 text-center text-xs text-white focus:border-[#D4AF37] outline-none">
                            <span class="text-[10px] text-stone-400">H (cm)</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button onclick="saveProductionSheet()" class="col-span-1 py-2 px-2 rounded-xl bg-stone-800 border border-[#D4AF37]/60 text-[#D4AF37] font-bold text-[11px] sm:text-xs flex items-center justify-center gap-1 hover:bg-stone-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span>ملف الإنتاج</span>
                </button>

                <button onclick="orderWhatsApp()" class="col-span-2 py-2 px-3 rounded-xl gold-bg font-bold text-xs sm:text-sm flex items-center justify-center gap-2 hover:opacity-95 transition">
                    <span>اعتماد المقاس والطلب عبر واتساب</span>
                </button>
            </div>
        </div>
    </footer>

    <script>
        let hasUserUploadedDesign = false;
        let designAspectRatio = 1.0;
        let lockAspectRatio = true;

        let originalDesignDataUrl = '';

        let designNaturalW = 1200;
        let designNaturalH = 1200;

        function generateTshirtFallback(angle) {
            const c = document.createElement('canvas');
            c.width = 600; c.height = 600;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 600, 600);

            ctx.fillStyle = '#f2f2f2';
            ctx.beginPath();
            if (angle === 'front' || angle === 'back') {
                ctx.moveTo(220, 110);
                ctx.lineTo(380, 110);
                ctx.lineTo(520, 175);
                ctx.lineTo(485, 290);
                ctx.lineTo(425, 265);
                ctx.lineTo(425, 510);
                ctx.lineTo(175, 510);
                ctx.lineTo(175, 265);
                ctx.lineTo(115, 290);
                ctx.lineTo(80, 175);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#d4d4d4';
                ctx.lineWidth = 8;
                ctx.beginPath();
                if (angle === 'front') ctx.arc(300, 112, 52, 0.1 * Math.PI, 0.9 * Math.PI);
                else ctx.arc(300, 110, 52, 0.05 * Math.PI, 0.95 * Math.PI);
                ctx.stroke();
            } else {
                ctx.moveTo(240, 115);
                ctx.lineTo(360, 115);
                ctx.lineTo(395, 280);
                ctx.lineTo(375, 510);
                ctx.lineTo(225, 510);
                ctx.lineTo(205, 280);
                ctx.closePath();
                ctx.fill();
            }
            return c.toDataURL();
        }

        function initDefaultLogo() {
            const c = document.createElement('canvas');
            c.width = 1200; c.height = 1200;
            const ctx = c.getContext('2d');
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 42;
            ctx.strokeRect(48, 48, 1104, 1104);
            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 260px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('عِـزوة', 600, 520);
            ctx.font = 'bold 95px Cairo, sans-serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('EZWA STUDIO', 600, 780);
            originalDesignDataUrl = c.toDataURL();
            document.getElementById('print-img').src = originalDesignDataUrl;

                    { short: 'A4 (21 × 29.7 سم)',      label: 'مقاس A4',       top: '46%', left: '50%', maxW: 21,   maxH: 29.7 },
                    { short: 'ظهر كبير (30 × 35 سم)',  label: 'ظهر كبير',      top: '49%', left: '50%', maxW: 30,   maxH: 35 },
                    { short: 'A3 (29.7 × 42 سم)',      label: 'مقاس A3 كامل',  top: '51%', left: '50%', maxW: 29.7, maxH: 42 }
                ],
                side_right: [
                    { short: 'شعار كم (8 × 8 سم)',     label: 'كم قياسي',      top: '38%', left: '50%', maxW: 8,    maxH: 8 },
                    { short: 'كم بارز (10 × 10 سم)',   label: 'كم بارز',       top: '38%', left: '50%', maxW: 10,   maxH: 10 }
                ],
                side_left: [
                    { short: 'شعار كم (8 × 8 سم)',     label: 'كم قياسي',      top: '38%', left: '50%', maxW: 8,    maxH: 8 },
                    { short: 'كم بارز (10 × 10 سم)',   label: 'كم بارز',       top: '38%', left: '50%', maxW: 10,   maxH: 10 }
                ]
            }
        };

        function checkPrintDPI() {
            const wInches = currentWcm / 2.54;
            const hInches = currentHcm / 2.54;
            const dpiW = designNaturalW / wInches;
            const dpiH = designNaturalH / hInches;
            const effectiveDpi = Math.round(Math.min(dpiW, dpiH));

            const dot = document.getElementById('dpi-dot');
            const txt = document.getElementById('dpi-text');

            if (effectiveDpi >= 200) {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                txt.innerText = `جودة التصميم: ممتازة للطباعة (${Math.min(300, effectiveDpi)} DPI)`;
                txt.className = 'text-stone-200 font-semibold';
            } else if (effectiveDpi >= 120) {
                dot.className = 'w-2 h-2 rounded-full bg-amber-400';
                txt.innerText = `جودة متوسطة (${effectiveDpi} DPI) — مقبولة لطباعة DTF`;
                txt.className = 'text-amber-300 font-semibold';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                txt.innerText = `تنبيه: دقة الصورة منخفضة (${effectiveDpi} DPI) لهذا المقاس الكبير`;
                txt.className = 'text-rose-300 font-semibold';
            }
        }

        function toggleRemoveWhiteBg() {
            const btn = document.getElementById('btn-remove-bg');
            const txt = document.getElementById('bg-btn-text');
            const printBox = document.getElementById('print-box');
            const printImg = document.getElementById('print-img');

            isBgRemoved = !isBgRemoved;

            if (isBgRemoved) {
                btn.classList.add('border-[#D4AF37]');
                txt.classList.add('gold-accent');
                txt.classList.remove('text-stone-300');
                printBox.classList.add('transparent-bg');

                const tempImg = new Image();
                tempImg.crossOrigin = 'anonymous';
                tempImg.onload = function() {
                    const c = document.createElement('canvas');
                    c.width = tempImg.naturalWidth;
                    c.height = tempImg.naturalHeight;
                    const ctx = c.getContext('2d');
                    ctx.drawImage(tempImg, 0, 0);
                    const imgData = ctx.getImageData(0, 0, c.width, c.height);
                    const d = imgData.data;

                    for (let i = 0; i < d.length; i += 4) {
                        const r = d[i], g = d[i + 1], b = d[i + 2];
                        if (r > 235 && g > 235 && b > 235) {
                            d[i + 3] = 0;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                    transparentDesignDataUrl = c.toDataURL('image/png');
                    printImg.src = transparentDesignDataUrl;
                };
                tempImg.src = originalDesignDataUrl;
            } else {
                btn.classList.remove('border-[#D4AF37]');
                txt.classList.remove('gold-accent');
                txt.classList.add('text-stone-300');
                printBox.classList.remove('transparent-bg');
                printImg.src = originalDesignDataUrl;
            }
        }

        function setProduct(prod) {
            currentProduct = prod;
            document.getElementById('prod-hoodie').classList.toggle('active', prod === 'hoodie');
            document.getElementById('prod-hoodie').classList.toggle('text-stone-300', prod !== 'hoodie');
            document.getElementById('prod-tshirt').classList.toggle('active', prod === 'tshirt');
            document.getElementById('prod-tshirt').classList.toggle('text-stone-300', prod !== 'tshirt');

            setAngle(currentAngle);
        }

        function setPrintSelected(selected) {
            const printBox = document.getElementById('print-box');
            if (selected) printBox.classList.remove('clean-view');
            else printBox.classList.add('clean-view');
        }

        function toggleRatioLock() {
            lockAspectRatio = !lockAspectRatio;
            const btn = document.getElementById('btn-lock-ratio');
            const icon = document.getElementById('lock-icon');
            const text = document.getElementById('lock-text');

            if (lockAspectRatio) {
                btn.classList.add('border-[#D4AF37]');
                icon.innerText = '🔒';
                text.innerHTML = 'تناسب<br>مقفل';
                text.classList.add('gold-accent');
                text.classList.remove('text-stone-400');
                if (hasUserUploadedDesign) {
                    if (currentMode === 'presets') selectSize(currentSizeIndex);
                    else applyManualCm('w');
                }
            } else {
                btn.classList.remove('border-[#D4AF37]');
                icon.innerText = '🔓';
                text.innerHTML = 'تناسب<br>حر';
                text.classList.remove('gold-accent');
                text.classList.add('text-stone-400');
                if (currentMode === 'presets') selectSize(currentSizeIndex);
            }
        }

        function updateDimensionsUI(wCm, hCm, labelTitle = '') {
            currentWcm = Math.round(wCm * 10) / 10;
            currentHcm = Math.round(hCm * 10) / 10;

            const printBox = document.getElementById('print-box');
            printBox.style.width = (currentWcm * CM_TO_PERCENT) + '%';
            printBox.style.height = (currentHcm * CM_TO_PERCENT) + '%';

            const textCm = `${currentWcm} × ${currentHcm} cm`;
            document.getElementById('live-badge').innerText = textCm;
            document.getElementById('paper-name-label').innerText = labelTitle ? `${labelTitle}:` : 'المقاس:';
            document.getElementById('size-label').innerText = textCm;

            document.getElementById('input-w-cm').value = currentWcm;
            document.getElementById('input-h-cm').value = currentHcm;

            checkPrintDPI();
        }

        function switchMode(mode) {
            currentMode = mode;
            setPrintSelected(true);
            const tabPresets = document.getElementById('tab-presets');
            const tabFree = document.getElementById('tab-free');
            const panelPresets = document.getElementById('presets-panel');
            const panelFree = document.getElementById('free-panel');

            if (mode === 'presets') {
                tabPresets.classList.add('active');
                tabPresets.classList.remove('text-stone-300');
                tabFree.classList.remove('active');
                tabFree.classList.add('text-stone-300');
                panelPresets.classList.remove('hidden');
                panelFree.classList.add('hidden');
                selectSize(currentSizeIndex);
            } else {
                tabFree.classList.add('active');
                tabFree.classList.remove('text-stone-300');
                tabPresets.classList.remove('active');
                tabPresets.classList.add('text-stone-300');
                panelFree.classList.remove('hidden');
                panelPresets.classList.add('hidden');
                updateDimensionsUI(currentWcm, currentHcm, 'مقاس حر');
            }
        }

        function applyManualCm(changedAxis) {
            setPrintSelected(true);
            let w = parseFloat(document.getElementById('input-w-cm').value) || 8;
            let h = parseFloat(document.getElementById('input-h-cm').value) || 8;

            if (lockAspectRatio && hasUserUploadedDesign) {
                if (changedAxis === 'w') h = w / designAspectRatio;
                else w = h * designAspectRatio;
            }

            w = Math.max(2, Math.min(35, w));
            h = Math.max(2, Math.min(45, h));
            document.getElementById('print-box').classList.add('smooth-resize');
            updateDimensionsUI(w, h, 'مقاس حر');
        }

        function renderSizesButtons() {
            const grid = document.getElementById('sizes-grid');
            const list = productSizes[currentProduct][currentAngle];

            grid.innerHTML = '';
            list.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `size-btn ${idx === currentSizeIndex && currentMode === 'presets' ? 'active' : ''} px-2 py-1.5 rounded-xl border border-stone-700 text-[10px] sm:text-[11px] transition`;
                btn.innerText = item.short;
                btn.onclick = () => selectSize(idx);
                grid.appendChild(btn);
            });
        }

        function selectSize(idx) {
            currentSizeIndex = idx;
            customMoved = false;
            setPrintSelected(true);
            const list = productSizes[currentProduct][currentAngle];
            const cfg = list[idx];

            document.querySelectorAll('.size-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });

            const printBox = document.getElementById('print-box');
            printBox.classList.add('smooth-resize');
            printBox.style.top = cfg.top;
            printBox.style.left = cfg.left;

            let finalW = cfg.maxW;
            let finalH = cfg.maxH;

            if (hasUserUploadedDesign && lockAspectRatio) {
                if (designAspectRatio >= (cfg.maxW / cfg.maxH)) {
                    finalW = cfg.maxW;
                    finalH = cfg.maxW / designAspectRatio;
                } else {
                    finalH = cfg.maxH;
                    finalW = cfg.maxH * designAspectRatio;
                }
            }

            updateDimensionsUI(finalW, finalH, cfg.label);
        }

        function setAngle(ang) {
            currentAngle = ang;
            const img = document.getElementById('garment-img');
            img.onerror = function() {
                if (currentProduct === 'tshirt') {
                    img.onerror = null;
                    img.src = generateTshirtFallback(ang);
                }
            };
            img.src = productImages[currentProduct][ang];

            document.querySelectorAll('.angle-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('text-stone-300');
            });
            const activeBtn = document.getElementById('ang-' + ang);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-stone-300');
            }

            const list = productSizes[currentProduct][ang];
            currentSizeIndex = (ang === 'back') ? list.length - 1 : 0;

            renderSizesButtons();
            selectSize(currentSizeIndex);
        }

        function resetPosition() {
            setPrintSelected(true);
            const printBox = document.getElementById('print-box');
            printBox.classList.add('smooth-resize');
            printBox.style.top = (currentAngle === 'back') ? '48%' : '42%';
            printBox.style.left = (currentAngle === 'side_right') ? '45%' : (currentAngle === 'side_left') ? '52%' : '50%';
        }

        function setColor(hex, name, isDark, btn) {
            currentColorName = name;
            currentColorHex = hex;
            document.getElementById('color-tint').style.backgroundColor = hex;
            
            const printBox = document.getElementById('print-box');
            if (isDark) printBox.classList.add('on-dark');
            else printBox.classList.remove('on-dark');

            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            btn.classList.add('active');
        }

        function applyLoadedDesign(srcUrl) {
            const tempImg = new Image();
            tempImg.crossOrigin = 'anonymous';
            tempImg.onload = function() {
                hasUserUploadedDesign = true;
                designNaturalW = tempImg.naturalWidth;
                designNaturalH = tempImg.naturalHeight;
                designAspectRatio = designNaturalW / designNaturalH;
                originalDesignDataUrl = srcUrl;
                isBgRemoved = false;
                document.getElementById('btn-remove-bg').classList.remove('border-[#D4AF37]');
                document.getElementById('bg-btn-text').classList.remove('gold-accent');
                document.getElementById('print-box').classList.remove('transparent-bg');

                const printImg = document.getElementById('print-img');
                printImg.crossOrigin = 'anonymous';
                printImg.src = originalDesignDataUrl;
                setPrintSelected(true);
                if (currentMode === 'presets') selectSize(currentSizeIndex);
                else applyManualCm('w');
            };
            tempImg.src = srcUrl;
        }

        function uploadDesign(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                applyLoadedDesign(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function saveProductionSheet() {
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 1360;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, 1200, 1360);

            ctx.fillStyle = '#181615';
            ctx.fillRect(0, 0, 1200, 110);
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, 110); ctx.lineTo(1200, 110); ctx.stroke();

            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 34px Cairo, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('عِزوة | ورقة مواصفات الإنتاج والطباعة (Production Sheet)', 1160, 68);

            const garmentEl = document.getElementById('garment-img');
            const printEl = document.getElementById('print-img');
            const printBox = document.getElementById('print-box');

            ctx.fillStyle = '#000000';
            ctx.fillRect(420, 140, 740, 740);
            ctx.strokeStyle = 'rgba(212,175,55,0.4)';
            ctx.lineWidth = 2;
            ctx.strokeRect(420, 140, 740, 740);

            ctx.drawImage(garmentEl, 420, 140, 740, 740);

            if (currentColorHex !== 'transparent') {
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = currentColorHex;
                ctx.fillRect(420, 140, 740, 740);
                ctx.restore();
            }

            const leftPct = parseFloat(printBox.style.left) / 100;
            const topPct = parseFloat(printBox.style.top) / 100;
            const wPct = parseFloat(printBox.style.width) / 100;
            const hPct = parseFloat(printBox.style.height) / 100;

            const drawW = wPct * 740;
            const drawH = hPct * 740;
            const drawX = 420 + (leftPct * 740) - (drawW / 2);
            const drawY = 140 + (topPct * 740) - (drawH / 2);

            ctx.save();
            if (!isBgRemoved && (currentColorHex === 'transparent' || currentColorHex === '#d8cab3')) {
                ctx.globalCompositeOperation = 'multiply';
            }
            ctx.drawImage(printEl, drawX, drawY, drawW, drawH);
            ctx.restore();

            ctx.fillStyle = '#181615';
            ctx.fillRect(40, 140, 350, 420);
            ctx.strokeStyle = 'rgba(212,175,55,0.4)';
            ctx.strokeRect(40, 140, 350, 420);

            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 20px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ملف الطباعة الصافي (Artwork)', 215, 180);

            const boxSize = 270;
            let artW = boxSize, artH = boxSize;
            if (designAspectRatio >= 1) artH = boxSize / designAspectRatio;
            else artW = boxSize * designAspectRatio;
            ctx.drawImage(printEl, 40 + (350 - artW) / 2, 210 + (300 - artH) / 2, artW, artH);

            ctx.fillStyle = '#181615';
            ctx.fillRect(40, 580, 350, 300);
            ctx.strokeRect(40, 580, 350, 300);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 20px Cairo, sans-serif';
            ctx.fillText('حالة الملف التقنية:', 365, 625);

            ctx.fillStyle = '#e5e5e5';
            ctx.font = '18px Cairo, sans-serif';
            ctx.fillText(`• تفريغ الخلفية: ${isBgRemoved ? 'مفعل (شفاف)' : 'أصلي'}`, 365, 670);
            ctx.fillText(`• الدقة: ${document.getElementById('dpi-text').innerText.split('(')[1]?.replace(')', '') || '300 DPI'}`, 365, 710);
            ctx.fillText(`• نوع الطباعة: DTF عالي الثبات`, 365, 750);
            ctx.fillText(`• الموضع: ${customMoved ? 'مخصص يدوياً' : 'قياسي موزون'}`, 365, 790);

            ctx.fillStyle = '#181615';
            ctx.fillRect(40, 910, 1120, 410);
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 2;
            ctx.strokeRect(40, 910, 1120, 410);

            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 28px Cairo, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('بيانات التنفيذ المعتمدة:', 1120, 965);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 26px Cairo, sans-serif';
            ctx.fillText(`1. القطعة: ${productNames[currentProduct]}`, 1120, 1030);
            ctx.fillText(`2. لون القماش: ${currentColorName}`, 1120, 1090);
            ctx.fillText(`3. جهة الطباعة: ${angleNames[currentAngle]}`, 1120, 1150);

            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 32px Cairo, sans-serif';
            ctx.fillText(`4. المقاس الفعلي للتنفيذ: ${currentWcm} × ${currentHcm} سم`, 1120, 1225);

            const link = document.createElement('a');
            link.download = `EZWA-Production-${currentProduct}-${currentAngle}-${currentWcm}x${currentHcm}cm.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function orderWhatsApp() {
            const faceName = angleNames[currentAngle];
            const prodName = productNames[currentProduct];
            const cfg = productSizes[currentProduct][currentAngle][currentSizeIndex];
            const modeText = currentMode === 'free' ? 'مقاس حر مخصص' : `${cfg.short}`;
            const posNote = customMoved ? ' (موضع مخصص)' : '';
            const bgNote = isBgRemoved ? ' (مع تفريغ الخلفية)' : '';
            const text = `السلام عليكم، اعتمدت طلب الطباعة في الاستوديو:\n- القطعة: ${prodName}\n- اللون: ${currentColorName}\n- الجهة: ${faceName}${posNote}\n- المقاس: ${modeText}\n- الأبعاد الدقيقة: ${currentWcm} × ${currentHcm} سم${bgNote}`;
            const url = `https://wa.me/966502777884?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        setAngle('front');

        // استقبال التصميم القادم من الكتالوج مع الإبقاء على الهودي كخيار افتراضي
        (function loadDesignFromCatalog() {
            const params = new URLSearchParams(window.location.search);
            const designUrl = params.get('design');
            if (designUrl) {
                applyLoadedDesign(designUrl);
            }
        })();

        const stage = document.getElementById('stage');
        const mainArea = document.getElementById('main-area');
        const printBox = document.getElementById('print-box');
        let isDraggingPrint = false;
        let activeCorner = null;
        let isSwipingStage = false;
        let startX = 0;
        const anglesOrder = ['front', 'side_right', 'back', 'side_left'];

        document.querySelectorAll('.resize-handle').forEach(handle => {
            handle.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                setPrintSelected(true);
                activeCorner = handle.dataset.corner;
                printBox.classList.remove('smooth-resize');
                printBox.classList.add('dragging');
                if (currentMode !== 'free') switchMode('free');
            });
        });

        printBox.addEventListener('pointerdown', (e) => {
            if (activeCorner) return;
            e.stopPropagation();
            setPrintSelected(true);
            isDraggingPrint = true;
            printBox.classList.remove('smooth-resize');
            printBox.classList.add('dragging');
        });

        stage.addEventListener('pointerdown', (e) => {
            if (isDraggingPrint || activeCorner) return;
            setPrintSelected(false);
            isSwipingStage = true;
            startX = e.clientX;
        });

        mainArea.addEventListener('pointerdown', (e) => {
            if (e.target === mainArea) setPrintSelected(false);
        });

        window.addEventListener('pointermove', (e) => {
            const rect = stage.getBoundingClientRect();

            if (activeCorner) {
                const centerX = rect.left + (parseFloat(printBox.style.left) / 100) * rect.width;
                const centerY = rect.top + (parseFloat(printBox.style.top) / 100) * rect.height;

                const distX = Math.abs(e.clientX - centerX) * 2;
                const distY = Math.abs(e.clientY - centerY) * 2;

                const widthPercent = (distX / rect.width) * 100;
                const heightPercent = (distY / rect.height) * 100;

                let newWcm = widthPercent / CM_TO_PERCENT;
                let newHcm = heightPercent / CM_TO_PERCENT;

                if (lockAspectRatio && hasUserUploadedDesign) {
                    newHcm = newWcm / designAspectRatio;
                }

                newWcm = Math.max(2.5, Math.min(32, newWcm));
                newHcm = Math.max(2.5, Math.min(42, newHcm));

                updateDimensionsUI(newWcm, newHcm, 'مقاس حر');
                return;
            }

            if (isDraggingPrint) {
                let xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                let yPercent = ((e.clientY - rect.top) / rect.height) * 100;

                xPercent = Math.max(15, Math.min(85, xPercent));
                yPercent = Math.max(15, Math.min(85, yPercent));

                printBox.style.left = xPercent + '%';
                printBox.style.top = yPercent + '%';
                customMoved = true;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (activeCorner) {
                activeCorner = null;
                printBox.classList.remove('dragging');
            }
            if (isDraggingPrint) {
                isDraggingPrint = false;
                printBox.classList.remove('dragging');
            }
            if (isSwipingStage) {
                isSwipingStage = false;
                const diff = e.clientX - startX;
                if (Math.abs(diff) > 35) {
                    let idx = anglesOrder.indexOf(currentAngle);
                    if (diff < 0) idx = (idx + 1) % 4;
                    else idx = (idx - 1 + 4) % 4;
                    setAngle(anglesOrder[idx]);
                }
            }
        });
    </script>
