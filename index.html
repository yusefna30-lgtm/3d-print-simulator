<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي طباعة الهودي الواقعي | عِزوة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0d0d0d;
            color: #f5f5f4;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        .glass-panel {
            background: rgba(24, 22, 21, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-accent { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; color: #121212; }
        .size-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
            border-color: #D4AF37;
        }
        .angle-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
        }
        .color-dot.active {
            outline: 2px solid #D4AF37;
            outline-offset: 2px;
            transform: scale(1.15);
        }

        /* إطار العرض متطابق مع خلفية الصور السوداء وأبعادها المربعة */
        .mockup-stage {
            position: relative;
            width: min(82vw, 370px);
            height: min(50vh, 370px);
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            background-color: #000000;
        }
        .hoodie-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s ease;
        }
        /* تلوين الهودي الأبيض مع الحفاظ على الخلفية السوداء سوداء كما هي */
        .color-overlay {
            position: absolute;
            inset: 0;
            mix-blend-mode: multiply;
            pointer-events: none;
            transition: background-color 0.3s ease;
        }
        .print-layer {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            mix-blend-mode: multiply;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .print-layer.on-dark {
            mix-blend-mode: normal;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative">

    <!-- الشريط العلوي -->
    <header class="w-full p-3 flex justify-between items-center z-20">
        <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg gold-bg flex items-center justify-center font-black text-sm">عِزوة</div>
            <div>
                <h1 class="text-xs sm:text-sm font-bold text-white leading-tight">محاكي طباعة الهودي</h1>
                <p class="text-[10px] text-stone-400">اسحب الصورة للتقليب بين الأوجه الأربعة</p>
            </div>
        </div>

        <!-- أزرار الزوايا الأربعة -->
        <div class="glass-panel p-1 rounded-xl flex gap-1">
            <button id="ang-front" onclick="setAngle('front')" class="angle-btn active px-2 py-1 rounded-lg text-[11px] transition">الأمام</button>
            <button id="ang-side_right" onclick="setAngle('side_right')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يمين</button>
            <button id="ang-back" onclick="setAngle('back')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">الظهر</button>
            <button id="ang-side_left" onclick="setAngle('side_left')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يسار</button>
        </div>
    </header>

    <!-- منطقة العرض الوسطى -->
    <main class="flex-1 flex items-center justify-center w-full relative z-10 px-4">
        <div id="stage" class="mockup-stage cursor-grab active:cursor-grabbing">
            <img id="hoodie-img" src="front.jpg.jpg" alt="هودي" class="hoodie-img">
            <div id="color-tint" class="color-overlay" style="background-color: transparent;"></div>
            <div id="print-box" class="print-layer" style="top: 36%; left: 58%; width: 28px; height: 28px;">
                <img id="print-img" src="" alt="التصميم" class="w-full h-full object-contain">
            </div>
        </div>

        <!-- أدوات الألوان ورفع التصميم -->
        <div class="fixed left-3 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-2">
            <div class="glass-panel p-2 rounded-xl flex flex-col items-center gap-2">
                <span class="text-[9px] text-stone-400">اللون</span>
                <button onclick="setColor('transparent', 'أبيض', false, this)" class="color-dot active w-6 h-6 rounded-full bg-[#ffffff] border border-stone-500 transition" title="أبيض"></button>
                <button onclick="setColor('#262629', 'أسود مطفي', true, this)" class="color-dot w-6 h-6 rounded-full bg-[#18181b] border border-stone-500 transition" title="أسود"></button>
                <button onclick="setColor('#5e192c', 'عنابي داكن', true, this)" class="color-dot w-6 h-6 rounded-full bg-[#4a1525] border border-stone-500 transition" title="عنابي"></button>
                <button onclick="setColor('#d8cab3', 'بيج رملي', false, this)" class="color-dot w-6 h-6 rounded-full bg-[#d6cbb8] border border-stone-500 transition" title="بيج"></button>
                <button onclick="setColor('#3b473c', 'زيتي داكن', true, this)" class="color-dot w-6 h-6 rounded-full bg-[#2d362e] border border-stone-500 transition" title="زيتي"></button>
            </div>

            <label class="glass-panel p-2 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#D4AF37] transition text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span class="text-[9px] font-bold text-white leading-tight">ارفع<br>تصميمك</span>
                <input type="file" accept="image/*" class="hidden" onchange="uploadDesign(event)">
            </label>
        </div>
    </main>

    <!-- الشريط السفلي للمقاسات -->
    <footer class="w-full p-2.5 z-20">
        <div class="max-w-2xl mx-auto glass-panel rounded-2xl p-3 shadow-2xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-white">اختر مقاس ومكان الطباعة:</span>
                <span id="size-label" class="text-[11px] gold-accent font-bold">صدر جانبي (5×5 سم)</span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 mb-2.5">
                <button onclick="setSize('pocket', this)" class="size-btn active px-2 py-1.5 rounded-xl border border-stone-700 text-[11px] transition">شعار صدر (5×5)</button>
                <button onclick="setSize('chest_mid', this)" class="size-btn px-2 py-1.5 rounded-xl border border-stone-700 text-[11px] transition">وسط الصدر (10×10)</button>
                <button onclick="setSize('chest_wide', this)" class="size-btn px-2 py-1.5 rounded-xl border border-stone-700 text-[11px] transition">صدر عريض (25×8)</button>
                <button onclick="setSize('chest_full', this)" class="size-btn px-2 py-1.5 rounded-xl border border-stone-700 text-[11px] transition">صدر كبير (20×20)</button>
                <button onclick="setSize('back_mid', this)" class="size-btn px-2 py-1.5 rounded-xl border border-stone-700 text-[11px] transition">ظهر وسط (25×30)</button>
                <button onclick="setSize('back_full', this)" class="size-btn px-2 py-1.5 rounded-xl border border-stone-700 text-[11px] transition">ظهر كامل (30×40)</button>
                <button onclick="setSize('sleeve_r', this)" class="size-btn px-2 py-1.5 rounded-xl border border-stone-700 text-[11px] transition">الكم الأيمن (8×8)</button>
                <button onclick="setSize('sleeve_l', this)" class="size-btn px-2 py-1.5 rounded-xl border border-stone-700 text-[11px] transition">الكم الأيسر (8×8)</button>
            </div>

            <button onclick="orderWhatsApp()" class="w-full py-2.5 rounded-xl gold-bg font-bold text-xs sm:text-sm flex items-center justify-center gap-2 hover:opacity-95 transition">
                <span>اعتماد هذا المقاس والطلب عبر واتساب</span>
            </button>
        </div>
    </footer>

    <script>
        function initDefaultLogo() {
            const c = document.createElement('canvas');
            c.width = 400; c.height = 400;
            const ctx = c.getContext('2d');
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 14;
            ctx.strokeRect(20, 20, 360, 360);
            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 85px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('عِـزوة', 200, 175);
            ctx.font = 'bold 30px Cairo, sans-serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('EZWA STUDIO', 200, 255);
            document.getElementById('print-img').src = c.toDataURL();
        }
        initDefaultLogo();

        let currentAngle = 'front';
        let currentSize = 'pocket';
        let currentColorName = 'أبيض';

        const imagesMap = {
            front:      'front.jpg.jpg',
            side_right: 'side_right.jpg.jpg',
            back:       'back.jpg.jpg',
            side_left:  'side_left.jpg.jpg'
        };

        const sizes = {
            pocket:     { label: 'صدر جانبي (5×5 سم)',     angle: 'front',      top: '36%', left: '58%', w: 28,  h: 28 },
            chest_mid:  { label: 'وسط الصدر (10×10 سم)',  angle: 'front',      top: '38%', left: '49%', w: 50,  h: 50 },
            chest_wide: { label: 'صدر عريض (25×8 سم)',    angle: 'front',      top: '36%', left: '49%', w: 96,  h: 32 },
            chest_full: { label: 'صدر كبير (20×20 سم)',   angle: 'front',      top: '40%', left: '49%', w: 84,  h: 84 },
            back_mid:   { label: 'ظهر وسط (25×30 سم)',    angle: 'back',       top: '48%', left: '49%', w: 88,  h: 105 },
            back_full:  { label: 'ظهر كامل (30×40 سم)',   angle: 'back',       top: '51%', left: '49%', w: 105, h: 128 },
            sleeve_r:   { label: 'الكم الأيمن (8×8 سم)',  angle: 'side_right', top: '44%', left: '44%', w: 34,  h: 34 },
            sleeve_l:   { label: 'الكم الأيسر (8×8 سم)', angle: 'side_left',  top: '44%', left: '53%', w: 34,  h: 34 }
        };

        function setAngle(ang) {
            currentAngle = ang;
            const img = document.getElementById('hoodie-img');
            img.src = imagesMap[ang];

            document.querySelectorAll('.angle-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('text-stone-300');
            });
            const activeBtn = document.getElementById('ang-' + ang);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-stone-300');
            }

            const printBox = document.getElementById('print-box');
            printBox.style.opacity = (sizes[currentSize].angle === ang) ? '1' : '0';
        }

        function setSize(key, btn) {
            currentSize = key;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const cfg = sizes[key];
            document.getElementById('size-label').innerText = cfg.label;

            setAngle(cfg.angle);

            const printBox = document.getElementById('print-box');
            printBox.style.top = cfg.top;
            printBox.style.left = cfg.left;
            printBox.style.width = cfg.w + 'px';
            printBox.style.height = cfg.h + 'px';
            printBox.style.opacity = '1';
        }

        function setColor(hex, name, isDark, btn) {
            currentColorName = name;
            document.getElementById('color-tint').style.backgroundColor = hex;
            
            const printBox = document.getElementById('print-box');
            if (isDark) {
                printBox.classList.add('on-dark');
            } else {
                printBox.classList.remove('on-dark');
            }

            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            btn.classList.add('active');
        }

        function uploadDesign(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('print-img').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function orderWhatsApp() {
            const sLabel = sizes[currentSize].label;
            const text = `السلام عليكم، جربت مقاس الطباعة على الهودي في المحاكي وأرغب باعتماد:\n- القطعة: هودي أوفر سايز\n- اللون: ${currentColorName}\n- المقاس والمكان: ${sLabel}`;
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // السحب باللمس أو الماوس للدوران الكامل 360 بين الأوجه الأربعة
        const stage = document.getElementById('stage');
        let startX = 0;
        const anglesOrder = ['front', 'side_right', 'back', 'side_left'];

        stage.addEventListener('pointerdown', (e) => {
            startX = e.clientX;
        });

        stage.addEventListener('pointerup', (e) => {
            const diff = e.clientX - startX;
            if (Math.abs(diff) > 30) {
                let idx = anglesOrder.indexOf(currentAngle);
                if (diff < 0) idx = (idx + 1) % 4;
                else idx = (idx - 1 + 4) % 4;
                setAngle(anglesOrder[idx]);
            }
        });
    </script>
</body>
</html>
