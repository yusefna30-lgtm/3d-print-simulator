<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي المقاسات ثلاثي الأبعاد 3D | عِزوة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #f5f5f4;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(24, 22, 21, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-accent {
            color: #D4AF37;
        }
        .gold-bg {
            background-color: #D4AF37;
            color: #121212;
        }
        .size-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
            border-color: #D4AF37;
        }
        .color-dot.active {
            ring: 2px solid #D4AF37;
            transform: scale(1.15);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <!-- حاوية المجسم ثلاثي الأبعاد -->
    <div id="canvas-container"></div>

    <!-- الشريط العلوي (Header) -->
    <header class="fixed top-0 left-0 right-0 z-20 p-3 flex justify-between items-center pointer-events-none">
        <!-- الهوية -->
        <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center gap-2.5 pointer-events-auto">
            <div class="w-8 h-8 rounded-lg gold-bg flex items-center justify-center font-black text-sm">عِزوة</div>
            <div>
                <h1 class="text-xs sm:text-sm font-bold text-white leading-tight">محاكي الطباعة 3D</h1>
                <p class="text-[10px] text-stone-400">اسحب للتدوير 360°</p>
            </div>
        </div>

        <!-- تبديل القطعة (هودي / تيشرت) -->
        <div class="glass-panel p-1 rounded-xl flex gap-1 pointer-events-auto">
            <button id="btn-hoodie" onclick="setGarment('hoodie')" class="px-3 py-1 rounded-lg text-xs font-bold transition gold-bg">هودي</button>
            <button id="btn-tshirt" onclick="setGarment('tshirt')" class="px-3 py-1 rounded-lg text-xs font-bold transition text-stone-300 hover:text-white">تيشرت</button>
        </div>
    </header>

    <!-- أدوات التحكم الجانبية العائمة (الألوان ورفع التصميم والزوايا) -->
    <div class="fixed top-20 left-3 z-20 flex flex-col gap-2 pointer-events-auto">
        <!-- الألوان -->
        <div class="glass-panel p-2 rounded-xl flex flex-col items-center gap-2">
            <span class="text-[9px] text-stone-400">اللون</span>
            <button onclick="setColor('#18181b', this)" class="color-dot active w-6 h-6 rounded-full bg-[#18181b] border border-stone-600 transition" title="أسود مطفي"></button>
            <button onclick="setColor('#4a1525', this)" class="color-dot w-6 h-6 rounded-full bg-[#4a1525] border border-stone-600 transition" title="عنابي داكن"></button>
            <button onclick="setColor('#d6cbb8', this)" class="color-dot w-6 h-6 rounded-full bg-[#d6cbb8] border border-stone-600 transition" title="بيج رملي"></button>
            <button onclick="setColor('#2d362e', this)" class="color-dot w-6 h-6 rounded-full bg-[#2d362e] border border-stone-600 transition" title="زيتي داكن"></button>
        </div>

        <!-- زر رفع تصميم -->
        <label class="glass-panel p-2 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#D4AF37] transition text-center" title="ارفع صورتك">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <span class="text-[9px] font-bold text-white leading-tight">ارفع<br>تصميمك</span>
            <input type="file" id="upload-design" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        </label>
    </div>

    <!-- أزرار الزوايا السريعة يمين الشاشة -->
    <div class="fixed top-20 right-3 z-20 flex flex-col gap-1.5 pointer-events-auto">
        <button onclick="rotateTo('front')" class="glass-panel px-2.5 py-1.5 rounded-lg text-[10px] font-bold hover:border-[#D4AF37] transition">الأمام</button>
        <button onclick="rotateTo('back')" class="glass-panel px-2.5 py-1.5 rounded-lg text-[10px] font-bold hover:border-[#D4AF37] transition">الظهر</button>
        <button onclick="rotateTo('sleeve')" class="glass-panel px-2.5 py-1.5 rounded-lg text-[10px] font-bold hover:border-[#D4AF37] transition">الكم</button>
        <button id="btn-autorotate" onclick="toggleAutoRotate()" class="glass-panel px-2.5 py-1.5 rounded-lg text-[10px] font-bold gold-accent border-[#D4AF37]/50 transition">دوران: إيقاف</button>
    </div>

    <!-- الشريط السفلي المدمج للمقاسات (Bottom Dock) -->
    <div class="fixed bottom-0 left-0 right-0 z-20 p-3 pointer-events-none">
        <div class="max-w-xl mx-auto glass-panel rounded-2xl p-3 pointer-events-auto shadow-2xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-white">اختر مقاس ومكان الطباعة:</span>
                <span id="size-desc" class="text-[11px] gold-accent font-semibold">صدر جانبي (5×5 سم)</span>
            </div>

            <!-- أزرار المقاسات القابلة للتمرير -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                <button onclick="setPrintSize('pocket', this)" class="size-btn active shrink-0 px-3 py-1.5 rounded-xl border border-stone-700 text-xs transition">
                    شعار صدر (5×5 سم)
                </button>
                <button onclick="setPrintSize('chest_mid', this)" class="size-btn shrink-0 px-3 py-1.5 rounded-xl border border-stone-700 text-xs transition">
                    وسط الصدر (10×10 سم)
                </button>
                <button onclick="setPrintSize('chest_wide', this)" class="size-btn shrink-0 px-3 py-1.5 rounded-xl border border-stone-700 text-xs transition">
                    صدر عريض (25×8 سم)
                </button>
                <button onclick="setPrintSize('chest_full', this)" class="size-btn shrink-0 px-3 py-1.5 rounded-xl border border-stone-700 text-xs transition">
                    صدر كبير (20×20 سم)
                </button>
                <button onclick="setPrintSize('back_mid', this)" class="size-btn shrink-0 px-3 py-1.5 rounded-xl border border-stone-700 text-xs transition">
                    ظهر وسط (25×30 سم)
                </button>
                <button onclick="setPrintSize('back_full', this)" class="size-btn shrink-0 px-3 py-1.5 rounded-xl border border-stone-700 text-xs transition">
                    ظهر كامل (30×40 سم)
                </button>
                <button onclick="setPrintSize('sleeve_side', this)" class="size-btn shrink-0 px-3 py-1.5 rounded-xl border border-stone-700 text-xs transition">
                    الكم (8×8 سم)
                </button>
            </div>

            <!-- زر الاعتماد والطلب -->
            <button onclick="sendWhatsApp()" class="w-full mt-1 py-2.5 rounded-xl gold-bg font-bold text-xs sm:text-sm flex items-center justify-center gap-2 hover:opacity-95 transition">
                <span>اعتماد هذا المقاس والطلب عبر واتساب</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // إعداد المشهد والكاميرا
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.2, 4.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(3, 5, 4);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xd4af37, 0.35);
        dirLight2.position.set(-4, 2, -3);
        scene.add(dirLight2);

        // مجموعة المجسم الرئيسية
        const garmentGroup = new THREE.Group();
        scene.add(garmentGroup);

        // خامة القماش
        const fabricMaterial = new THREE.MeshStandardMaterial({
            color: 0x18181b,
            roughness: 0.88,
            metalness: 0.05
        });

        // بناء المجسمات
        let hoodieParts = new THREE.Group();
        let tshirtParts = new THREE.Group();

        function buildModels() {
            // 1. الجذع المشترك (Boxy / Oversized)
            const torsoGeo = new THREE.CylinderGeometry(0.72, 0.76, 1.85, 32);
            torsoGeo.scale(1.15, 1, 0.68);
            const torso = new THREE.Mesh(torsoGeo, fabricMaterial);

            // الياقة
            const collarGeo = new THREE.TorusGeometry(0.32, 0.06, 16, 32);
            collarGeo.rotateX(Math.PI / 2.2);
            const collar = new THREE.Mesh(collarGeo, fabricMaterial);
            collar.position.set(0, 0.92, 0.05);

            // --- مجسم الهودي ---
            const hTorso = torso.clone();
            hoodieParts.add(hTorso);

            // قبعة الهودي (Hood) في الخلف
            const hoodGeo = new THREE.SphereGeometry(0.48, 24, 24, 0, Math.PI * 2, 0, Math.PI * 0.65);
            hoodGeo.scale(1.05, 0.95, 1.15);
            const hood = new THREE.Mesh(hoodGeo, fabricMaterial);
            hood.position.set(0, 0.88, -0.28);
            hood.rotation.x = -0.35;
            hoodieParts.add(hood);

            // الجيب الأمامي (Kangaroo Pocket)
            const pocketGeo = new THREE.BoxGeometry(0.95, 0.45, 0.12);
            const pocket = new THREE.Mesh(pocketGeo, fabricMaterial);
            pocket.position.set(0, -0.45, 0.49);
            hoodieParts.add(pocket);

            // أكمام الهودي الطويلة
            const hSleeveGeo = new THREE.CylinderGeometry(0.24, 0.17, 1.45, 20);
            const hLeftSleeve = new THREE.Mesh(hSleeveGeo, fabricMaterial);
            hLeftSleeve.position.set(-1.02, 0.25, 0);
            hLeftSleeve.rotation.z = -0.38;
            hoodieParts.add(hLeftSleeve);

            const hRightSleeve = new THREE.Mesh(hSleeveGeo, fabricMaterial);
            hRightSleeve.position.set(1.02, 0.25, 0);
            hRightSleeve.rotation.z = 0.38;
            hoodieParts.add(hRightSleeve);

            // --- مجسم التيشرت ---
            const tTorso = torso.clone();
            tshirtParts.add(tTorso);
            tshirtParts.add(collar);

            // أكمام التيشرت القصيرة الواسعة (Drop Shoulder)
            const tSleeveGeo = new THREE.CylinderGeometry(0.28, 0.25, 0.68, 20);
            const tLeftSleeve = new THREE.Mesh(tSleeveGeo, fabricMaterial);
            tLeftSleeve.position.set(-0.98, 0.55, 0);
            tLeftSleeve.rotation.z = -0.55;
            tshirtParts.add(tLeftSleeve);

            const tRightSleeve = new THREE.Mesh(tSleeveGeo, fabricMaterial);
            tRightSleeve.position.set(0.98, 0.55, 0);
            tRightSleeve.rotation.z = 0.55;
            tshirtParts.add(tRightSleeve);

            tshirtParts.visible = false;
            garmentGroup.add(hoodieParts);
            garmentGroup.add(tshirtParts);
        }

        buildModels();

        // إنشاء تصميم افتراضي (Canvas Texture)
        function createDefaultTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');

            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 14;
            ctx.strokeRect(24, 24, 464, 464);

            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 90px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('عِـزوة', 256, 220);

            ctx.font = 'bold 34px Cairo, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('EZWA STUDIO', 256, 310);

            return new THREE.CanvasTexture(c);
        }

        // طبقة الطباعة (Print Mesh)
        let currentTexture = createDefaultTexture();
        const printMaterial = new THREE.MeshBasicMaterial({
            map: currentTexture,
            transparent: true,
            side: THREE.DoubleSide
        });

        const printGeo = new THREE.PlaneGeometry(0.25, 0.25);
        const printMesh = new THREE.Mesh(printGeo, printMaterial);
        garmentGroup.add(printMesh);

        // إعدادات المقاسات
        let currentGarment = 'hoodie';
        let currentSizeKey = 'pocket';
        let currentColorName = 'أسود مطفي';
        let targetRotationY = 0;

        const sizeConfigs = {
            pocket: { label: 'صدر جانبي (5×5 سم)', w: 0.22, h: 0.22, pos: [0.32, 0.38, 0.53], rot: [0, 0, 0], targetY: 0 },
            chest_mid: { label: 'وسط الصدر (10×10 سم)', w: 0.38, h: 0.38, pos: [0, 0.32, 0.53], rot: [0, 0, 0], targetY: 0 },
            chest_wide: { label: 'صدر عريض (25×8 سم)', w: 0.72, h: 0.24, pos: [0, 0.36, 0.53], rot: [0, 0, 0], targetY: 0 },
            chest_full: { label: 'صدر كبير (20×20 سم)', w: 0.62, h: 0.62, pos: [0, 0.22, 0.53], rot: [0, 0, 0], targetY: 0 },
            back_mid: { label: 'ظهر وسط (25×30 سم)', w: 0.68, h: 0.80, pos: [0, 0.05, -0.53], rot: [0, Math.PI, 0], targetY: Math.PI },
            back_full: { label: 'ظهر كامل (30×40 سم)', w: 0.82, h: 1.05, pos: [0, -0.02, -0.53], rot: [0, Math.PI, 0], targetY: Math.PI },
            sleeve_side: { label: 'الكم الجانبي (8×8 سم)', w: 0.24, h: 0.24, pos: [1.05, 0.45, 0.16], rot: [0, Math.PI / 2, 0.38], targetY: -Math.PI / 2 }
        };

        function updatePrintTransform() {
            const cfg = sizeConfigs[currentSizeKey];
            printMesh.scale.set(cfg.w / 0.25, cfg.h / 0.25, 1);

            // تعديل طفيف لموقع الظهر في الهودي لتجنب القبعة
            let yOffset = 0;
            if (currentGarment === 'hoodie' && (currentSizeKey === 'back_mid' || currentSizeKey === 'back_full')) {
                yOffset = -0.14;
            }

            printMesh.position.set(cfg.pos[0], cfg.pos[1] + yOffset, cfg.pos[2]);
            printMesh.rotation.set(cfg.rot[0], cfg.rot[1], cfg.rot[2]);
            targetRotationY = cfg.targetY;
            document.getElementById('size-desc').innerText = cfg.label;
        }

        function setPrintSize(key, btn) {
            currentSizeKey = key;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            autoRotate = false;
            document.getElementById('btn-autorotate').innerText = 'دوران: إيقاف';
            updatePrintTransform();
        }

        function setGarment(type) {
            currentGarment = type;
            const btnH = document.getElementById('btn-hoodie');
            const btnT = document.getElementById('btn-tshirt');

            if (type === 'hoodie') {
                hoodieParts.visible = true;
                tshirtParts.visible = false;
                btnH.classList.add('gold-bg');
                btnH.classList.remove('text-stone-300');
                btnT.classList.remove('gold-bg');
                btnT.classList.add('text-stone-300');
            } else {
                hoodieParts.visible = false;
                tshirtParts.visible = true;
                btnT.classList.add('gold-bg');
                btnT.classList.remove('text-stone-300');
                btnH.classList.remove('gold-bg');
                btnH.classList.add('text-stone-300');
            }
            updatePrintTransform();
        }

        function setColor(hex, btn) {
            fabricMaterial.color.set(hex);
            currentColorName = btn.title;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            btn.classList.add('active');
        }

        function rotateTo(side) {
            autoRotate = false;
            document.getElementById('btn-autorotate').innerText = 'دوران: إيقاف';
            if (side === 'front') targetRotationY = 0;
            if (side === 'back') targetRotationY = Math.PI;
            if (side === 'sleeve') targetRotationY = -Math.PI / 2;
        }

        let autoRotate = false;
        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.getElementById('btn-autorotate').innerText = autoRotate ? 'دوران: يعمل' : 'دوران: إيقاف';
        }

        // رفع صورة العميل
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const tex = new THREE.Texture(img);
                    tex.needsUpdate = true;
                    printMaterial.map = tex;
                    printMaterial.needsUpdate = true;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // إرسال للواتساب
        function sendWhatsApp() {
            const gName = currentGarment === 'hoodie' ? 'هودي' : 'تيشرت';
            const sLabel = sizeConfigs[currentSizeKey].label;
            const text = `السلام عليكم، جربت مقاس الطباعة في المحاكي 3D وأرغب باعتماد:\n- القطعة: ${gName}\n- اللون: ${currentColorName}\n- المقاس والمكان: ${sLabel}`;
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // التحكم بالسحب واللمس (360 درجة)
        let isDragging = false;
        let previousX = 0;

        container.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousX = e.clientX;
            autoRotate = false;
            document.getElementById('btn-autorotate').innerText = 'دوران: إيقاف';
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousX;
            targetRotationY += deltaX * 0.012;
            previousX = e.clientX;
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        // التجاوب مع تغيير حجم النافذة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // حلقة التحريك (Animation Loop)
        updatePrintTransform();
        function animate() {
            requestAnimationFrame(animate);
            if (autoRotate) {
                targetRotationY += 0.01;
            }
            garmentGroup.rotation.y += (targetRotationY - garmentGroup.rotation.y) * 0.1;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
