<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي طباعة الهودي القياسي | عِزوة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0d0d0d;
            color: #f5f5f4;
            margin: 0;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(24, 22, 21, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-accent { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; color: #121212; }
        .size-btn.active, .mode-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
            border-color: #D4AF37;
        }
        .angle-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
        }
        .color-dot.active {
            outline: 2px solid #D4AF37;
            outline-offset: 2px;
            transform: scale(1.15);
        }

        .mockup-stage {
            position: relative;
            width: min(80vw, 350px);
            height: min(44dvh, 350px);
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            background-color: #000000;
        }
        .hoodie-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .color-overlay {
            position: absolute;
            inset: 0;
            mix-blend-mode: multiply;
            pointer-events: none;
            transition: background-color 0.3s ease;
        }

        /* إطار الورقة القياسية (A3 / A4 / A5) لتوضيح حدود مساحة الطباعة الحقيقية */
        .paper-guide {
            position: absolute;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(255, 255, 255, 0.28);
            background-color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            transition: all 0.25s ease;
            border-radius: 3px;
        }
        .paper-guide-tag {
            position: absolute;
            bottom: -16px;
            right: 4px;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.55);
            direction: ltr;
        }

        .print-layer {
            position: absolute;
            transform: translate(-50%, -50%);
            mix-blend-mode: multiply;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px dashed rgba(212, 175, 55, 0.75);
            border-radius: 2px;
            z-index: 10;
        }
        .print-layer.smooth-resize {
            transition: width 0.25s ease, height 0.25s ease, top 0.25s ease, left 0.25s ease;
        }
        .print-layer:hover, .print-layer.dragging {
            border: 1.5px solid #D4AF37;
            background-color: rgba(212, 175, 55, 0.1);
        }
        .print-layer.on-dark {
            mix-blend-mode: normal;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
        }

        .resize-handle {
            position: absolute;
            width: 13px;
            height: 13px;
            background-color: #D4AF37;
            border: 2px solid #121212;
            border-radius: 50%;
            z-index: 30;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            transition: transform 0.15s ease;
        }
        .resize-handle:hover, .resize-handle:active {
            transform: scale(1.3);
            background-color: #ffffff;
        }
        .handle-nw { top: -6.5px; left: -6.5px; cursor: nwse-resize; }
        .handle-ne { top: -6.5px; right: -6.5px; cursor: nesw-resize; }
        .handle-sw { bottom: -6.5px; left: -6.5px; cursor: nesw-resize; }
        .handle-se { bottom: -6.5px; right: -6.5px; cursor: nwse-resize; }

        .live-cm-badge {
            position: absolute;
            top: -23px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.94);
            color: #D4AF37;
            border: 1px solid rgba(212, 175, 55, 0.6);
            padding: 0px 6px;
            border-radius: 5px;
            font-size: 9.5px;
            font-weight: 700;
            white-space: nowrap;
            pointer-events: none;
            direction: ltr;
        }
    </style>
</head>
<body class="w-screen flex flex-col justify-between items-center relative">

    <!-- الشريط العلوي -->
    <header class="w-full px-3 pt-2.5 pb-1 flex justify-between items-center z-20 shrink-0">
        <div class="glass-panel px-3 py-1 rounded-xl flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg gold-bg flex items-center justify-center font-black text-xs">عِزوة</div>
            <div>
                <h1 class="text-xs font-bold text-white leading-tight">محاكي مقاسات المطابع</h1>
                <p class="text-[9.5px] text-stone-400">مقياس رسم حقيقي 1:1</p>
            </div>
        </div>

        <div class="glass-panel p-1 rounded-xl flex gap-1">
            <button id="ang-front" onclick="setAngle('front')" class="angle-btn active px-2.5 py-1 rounded-lg text-[11px] transition">الأمام</button>
            <button id="ang-side_right" onclick="setAngle('side_right')" class="angle-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يمين</button>
            <button id="ang-back" onclick="setAngle('back')" class="angle-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">الظهر</button>
            <button id="ang-side_left" onclick="setAngle('side_left')" class="angle-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يسار</button>
        </div>
    </header>

    <!-- منطقة العرض الوسطى -->
    <main class="flex-1 flex items-center justify-center w-full relative z-10 px-4 min-h-0">
        <div id="stage" class="mockup-stage cursor-grab active:cursor-grabbing">
            <img id="hoodie-img" src="front.jpg.jpg" alt="هودي" class="hoodie-img">
            <div id="color-tint" class="color-overlay" style="background-color: transparent;"></div>
            
            <!-- إطار حدود الورقة القياسية (يوضح مقاس A3 / A4 / A5 الكامل) -->
            <div id="paper-guide" class="paper-guide" style="top: 34%; left: 58%; width: 9.2%; height: 9.2%;">
                <span id="paper-guide-tag" class="paper-guide-tag">8×8 cm</span>
            </div>

            <!-- صندوق التصميم الفعلي -->
            <div id="print-box" class="print-layer smooth-resize" style="top: 34%; left: 58%; width: 9.2%; height: 9.2%;">
                <div id="live-badge" class="live-cm-badge">8.0 × 8.0 cm</div>
                <img id="print-img" src="" alt="التصميم" class="w-full h-full object-contain pointer-events-none">
                
                <div class="resize-handle handle-nw" data-corner="nw"></div>
                <div class="resize-handle handle-ne" data-corner="ne"></div>
                <div class="resize-handle handle-sw" data-corner="sw"></div>
                <div class="resize-handle handle-se" data-corner="se"></div>
            </div>
        </div>

        <!-- أدوات التحكم الجانبية -->
        <div class="fixed left-3 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-1.5">
            <div class="glass-panel p-1.5 rounded-xl flex flex-col items-center gap-1.5">
                <span class="text-[9px] text-stone-400">اللون</span>
                <button onclick="setColor('transparent', 'أبيض', false, this)" class="color-dot active w-5 h-5 rounded-full bg-[#ffffff] border border-stone-500 transition" title="أبيض"></button>
                <button onclick="setColor('#262629', 'أسود مطفي', true, this)" class="color-dot w-5 h-5 rounded-full bg-[#18181b] border border-stone-500 transition" title="أسود"></button>
                <button onclick="setColor('#5e192c', 'عنابي داكن', true, this)" class="color-dot w-5 h-5 rounded-full bg-[#4a1525] border border-stone-500 transition" title="عنابي"></button>
                <button onclick="setColor('#d8cab3', 'بيج رملي', false, this)" class="color-dot w-5 h-5 rounded-full bg-[#d6cbb8] border border-stone-500 transition" title="بيج"></button>
                <button onclick="setColor('#3b473c', 'زيتي داكن', true, this)" class="color-dot w-5 h-5 rounded-full bg-[#2d362e] border border-stone-500 transition" title="زيتي"></button>
            </div>

            <label class="glass-panel p-1.5 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#D4AF37] transition text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span class="text-[8.5px] font-bold text-white leading-tight">ارفع<br>تصميمك</span>
                <input type="file" accept="image/*" class="hidden" onchange="uploadDesign(event)">
            </label>

            <button id="btn-lock-ratio" onclick="toggleRatioLock()" class="glass-panel p-1.5 rounded-xl flex flex-col items-center justify-center border-[#D4AF37] transition text-center">
                <span id="lock-icon" class="text-[11px]">🔒</span>
                <span id="lock-text" class="text-[8px] font-bold gold-accent leading-tight">تناسب<br>مقفل</span>
            </button>

            <button onclick="resetPosition()" class="glass-panel p-1.5 rounded-xl flex flex-col items-center justify-center hover:border-[#D4AF37] transition text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <span class="text-[8px] font-bold text-stone-300">توسيط</span>
            </button>
        </div>
    </main>

    <!-- الشريط السفلي المدمج بدون أي قص -->
    <footer class="w-full px-3 pb-2.5 pt-1 z-20 shrink-0">
        <div class="max-w-2xl mx-auto glass-panel rounded-2xl p-2.5 shadow-2xl">
            
            <div class="flex flex-wrap justify-between items-center gap-1.5 mb-1.5">
                <div class="flex bg-black/50 p-0.5 rounded-xl border border-stone-800">
                    <button id="tab-presets" onclick="switchMode('presets')" class="mode-btn active px-2.5 py-1 rounded-lg text-[11px] transition">مقاسات المطابع</button>
                    <button id="tab-free" onclick="switchMode('free')" class="mode-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">مقاس حر (سحب الزوايا)</button>
                </div>

                <div class="flex items-center gap-1.5">
                    <span class="text-[10px] text-stone-400">صافي التصميم:</span>
                    <span id="size-label" class="text-[11px] gold-accent font-bold" dir="ltr">8.0 × 8.0 cm</span>
                </div>
            </div>

            <!-- المقاسات القياسية للمطابع -->
            <div id="presets-panel">
                <div id="sizes-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 mb-2"></div>
            </div>

            <!-- لوحة المقاس الحر -->
            <div id="free-panel" class="hidden mb-2 bg-black/40 p-2 rounded-xl border border-stone-800">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                    <p class="text-[10.5px] text-stone-300">اسحب زوايا التصميم أو أدخل المقاس بالسنتيمتر:</p>
                    <div class="flex items-center gap-2" dir="ltr">
                        <div class="flex items-center gap-1">
                            <input id="input-w-cm" type="number" step="0.5" min="2" max="35" value="8" onchange="applyManualCm('w')" class="w-14 bg-stone-900 border border-stone-700 rounded-lg px-1.5 py-1 text-center text-xs text-white focus:border-[#D4AF37] outline-none">
                            <span class="text-[10px] text-stone-400">W</span>
                        </div>
                        <span class="text-stone-500 text-xs">×</span>
                        <div class="flex items-center gap-1">
                            <input id="input-h-cm" type="number" step="0.5" min="2" max="45" value="8" onchange="applyManualCm('h')" class="w-14 bg-stone-900 border border-stone-700 rounded-lg px-1.5 py-1 text-center text-xs text-white focus:border-[#D4AF37] outline-none">
                            <span class="text-[10px] text-stone-400">H (cm)</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- أزرار الإجراءات: حفظ الصورة + إرسال واتساب -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="saveDesignImage()" class="col-span-1 py-2 px-2 rounded-xl bg-stone-800 border border-[#D4AF37]/50 text-[#D4AF37] font-bold text-xs flex items-center justify-center gap-1.5 hover:bg-stone-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>حفظ الصورة</span>
                </button>

                <button onclick="orderWhatsApp()" class="col-span-2 py-2 px-3 rounded-xl gold-bg font-bold text-xs sm:text-sm flex items-center justify-center gap-2 hover:opacity-95 transition">
                    <span>اعتماد المقاس والطلب عبر واتساب</span>
                </button>
            </div>
        </div>
    </footer>

    <script>
        let designAspectRatio = 1.0;
        let lockAspectRatio = true;

        function initDefaultLogo() {
            const c = document.createElement('canvas');
            c.width = 400; c.height = 400;
            const ctx = c.getContext('2d');
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 16;
            ctx.strokeRect(16, 16, 368, 368);
            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 90px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('عِـزوة', 200, 175);
            ctx.font = 'bold 34px Cairo, sans-serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('EZWA', 200, 265);
            document.getElementById('print-img').src = c.toDataURL();
            designAspectRatio = 1.0;
        }
        initDefaultLogo();

        let currentAngle = 'front';
        let currentSizeIndex = 0;
        let currentColorName = 'أبيض';
        let currentColorHex = 'transparent';
        let currentMode = 'presets';
        let customMoved = false;

        let currentWcm = 8.0;
        let currentHcm = 8.0;

        // مقياس رسم واقعي يطابق حجم الهودي الفعلي (1 سم = 1.15% من الإطار)
        const CM_TO_PERCENT = 1.15;

        const imagesMap = {
            front:      'front.jpg.jpg',
            side_right: 'side_right.jpg.jpg',
            back:       'back.jpg.jpg',
            side_left:  'side_left.jpg.jpg'
        };

        const angleNames = {
            front:      'الأمام (الصدر)',
            side_right: 'الكم الأيمن',
            back:       'الخلف (الظهر)',
            side_left:  'الكم الأيسر'
        };

        const angleSizes = {
            front: [
                { short: 'شعار صدر (8 سم)',       label: 'شعار صدر',     top: '34%', left: '58%', maxW: 8,    maxH: 8,    fixedBox: false },
                { short: 'شعار بارز (10 سم)',     label: 'شعار بارز',     top: '34%', left: '58%', maxW: 10,   maxH: 10,   fixedBox: false },
                { short: 'وسط الصدر (20 سم)',     label: 'وسط الصدر',     top: '39%', left: '49%', maxW: 20,   maxH: 20,   fixedBox: false },
                { short: 'صدر عريض (25×10 سم)',   label: 'صدر عريض',      top: '36%', left: '49%', maxW: 25,   maxH: 10,   fixedBox: true },
                { short: 'A5 (14.8 × 21 سم)',     label: 'ورقة A5',       top: '40%', left: '49%', maxW: 14.8, maxH: 21,   fixedBox: false },
                { short: 'A4 (21 × 29.7 سم)',     label: 'ورقة A4',       top: '43%', left: '49%', maxW: 21,   maxH: 29.7, fixedBox: false }
            ],
            back: [
                { short: 'أسفل القبعة (8 سم)',    label: 'أسفل القبعة',   top: '33%', left: '49%', maxW: 8,    maxH: 8,    fixedBox: false },
                { short: 'A5 (14.8 × 21 سم)',     label: 'ورقة A5',       top: '44%', left: '49%', maxW: 14.8, maxH: 21,   fixedBox: false },
                { short: 'A4 (21 × 29.7 سم)',     label: 'ورقة A4',       top: '48%', left: '49%', maxW: 21,   maxH: 29.7, fixedBox: false },
                { short: 'ظهر كبير (30 × 35 سم)', label: 'ظهر كبير',      top: '51%', left: '49%', maxW: 30,   maxH: 35,   fixedBox: false },
                { short: 'A3 (29.7 × 42 سم)',     label: 'ورقة A3 كاملة', top: '53%', left: '49%', maxW: 29.7, maxH: 42,   fixedBox: false }
            ],
            side_right: [
                { short: 'شعار كم (8 سم)',        label: 'كم قياسي',      top: '42%', left: '44%', maxW: 8,    maxH: 8,    fixedBox: false },
                { short: 'كم بارز (10 سم)',       label: 'كم بارز',       top: '42%', left: '44%', maxW: 10,   maxH: 10,   fixedBox: false },
                { short: 'كم طولي (8 × 25 سم)',   label: 'كم طولي',       top: '49%', left: '44%', maxW: 8,    maxH: 25,   fixedBox: true }
            ],
            side_left: [
                { short: 'شعار كم (8 سم)',        label: 'كم قياسي',      top: '42%', left: '53%', maxW: 8,    maxH: 8,    fixedBox: false },
                { short: 'كم بارز (10 سم)',       label: 'كم بارز',       top: '42%', left: '53%', maxW: 10,   maxH: 10,   fixedBox: false },
                { short: 'كم طولي (8 × 25 سم)',   label: 'كم طولي',       top: '49%', left: '53%', maxW: 8,    maxH: 25,   fixedBox: true }
            ]
        };

        function toggleRatioLock() {
            lockAspectRatio = !lockAspectRatio;
            const btn = document.getElementById('btn-lock-ratio');
            const icon = document.getElementById('lock-icon');
            const text = document.getElementById('lock-text');

            if (lockAspectRatio) {
                btn.classList.add('border-[#D4AF37]');
                icon.innerText = '🔒';
                text.innerHTML = 'تناسب<br>مقفل';
                text.classList.add('gold-accent');
                text.classList.remove('text-stone-400');
                if (currentMode === 'presets') selectSize(currentSizeIndex);
                else applyManualCm('w');
            } else {
                btn.classList.remove('border-[#D4AF37]');
                icon.innerText = '🔓';
                text.innerHTML = 'تناسب<br>حر';
                text.classList.remove('gold-accent');
                text.classList.add('text-stone-400');
                if (currentMode === 'presets') selectSize(currentSizeIndex);
            }
        }

        function updateDimensionsUI(wCm, hCm, paperLabel = '') {
            currentWcm = Math.round(wCm * 10) / 10;
            currentHcm = Math.round(hCm * 10) / 10;

            const printBox = document.getElementById('print-box');
            printBox.style.width = (currentWcm * CM_TO_PERCENT) + '%';
            printBox.style.height = (currentHcm * CM_TO_PERCENT) + '%';

            const textCm = `${currentWcm} × ${currentHcm} cm`;
            document.getElementById('live-badge').innerText = textCm;
            document.getElementById('size-label').innerText = paperLabel ? `${paperLabel} | صافي: ${textCm}` : textCm;

            document.getElementById('input-w-cm').value = currentWcm;
            document.getElementById('input-h-cm').value = currentHcm;
        }

        function switchMode(mode) {
            currentMode = mode;
            const tabPresets = document.getElementById('tab-presets');
            const tabFree = document.getElementById('tab-free');
            const panelPresets = document.getElementById('presets-panel');
            const panelFree = document.getElementById('free-panel');
            const paperGuide = document.getElementById('paper-guide');

            if (mode === 'presets') {
                tabPresets.classList.add('active');
                tabPresets.classList.remove('text-stone-300');
                tabFree.classList.remove('active');
                tabFree.classList.add('text-stone-300');
                panelPresets.classList.remove('hidden');
                panelFree.classList.add('hidden');
                paperGuide.style.opacity = '1';
                selectSize(currentSizeIndex);
            } else {
                tabFree.classList.add('active');
                tabFree.classList.remove('text-stone-300');
                tabPresets.classList.remove('active');
                tabPresets.classList.add('text-stone-300');
                panelFree.classList.remove('hidden');
                panelPresets.classList.add('hidden');
                paperGuide.style.opacity = '0';
                updateDimensionsUI(currentWcm, currentHcm, 'مقاس حر');
            }
        }

        function applyManualCm(changedAxis) {
            let w = parseFloat(document.getElementById('input-w-cm').value) || 8;
            let h = parseFloat(document.getElementById('input-h-cm').value) || 8;

            if (lockAspectRatio) {
                if (changedAxis === 'w') h = w / designAspectRatio;
                else w = h * designAspectRatio;
            }

            w = Math.max(2, Math.min(35, w));
            h = Math.max(2, Math.min(45, h));
            document.getElementById('print-box').classList.add('smooth-resize');
            updateDimensionsUI(w, h, 'مقاس حر');
        }

        function renderSizesButtons() {
            const grid = document.getElementById('sizes-grid');
            const list = angleSizes[currentAngle];

            grid.innerHTML = '';
            list.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `size-btn ${idx === currentSizeIndex && currentMode === 'presets' ? 'active' : ''} px-2 py-1.5 rounded-xl border border-stone-700 text-[10px] sm:text-[11px] transition`;
                btn.innerText = item.short;
                btn.onclick = () => selectSize(idx);
                grid.appendChild(btn);
            });
        }

        function selectSize(idx) {
            currentSizeIndex = idx;
            customMoved = false;
            const list = angleSizes[currentAngle];
            const cfg = list[idx];

            document.querySelectorAll('.size-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });

            // 1. رسم إطار الورقة القياسية الكامل (مثل A3 = 29.7 × 42 cm)
            const paperGuide = document.getElementById('paper-guide');
            paperGuide.style.opacity = '1';
            paperGuide.style.top = cfg.top;
            paperGuide.style.left = cfg.left;
            paperGuide.style.width = (cfg.maxW * CM_TO_PERCENT) + '%';
            paperGuide.style.height = (cfg.maxH * CM_TO_PERCENT) + '%';
            document.getElementById('paper-guide-tag').innerText = `${cfg.label} (${cfg.maxW}×${cfg.maxH} cm)`;

            // 2. وضع التصميم داخل إطار الورقة مع حفظ التناسب الحقيقي للصورة
            const printBox = document.getElementById('print-box');
            printBox.classList.add('smooth-resize');
            printBox.style.top = cfg.top;
            printBox.style.left = cfg.left;

            let finalW = cfg.maxW;
            let finalH = cfg.maxH;

            if (lockAspectRatio && !cfg.fixedBox) {
                if (designAspectRatio >= (cfg.maxW / cfg.maxH)) {
                    finalW = cfg.maxW;
                    finalH = cfg.maxW / designAspectRatio;
                } else {
                    finalH = cfg.maxH;
                    finalW = cfg.maxH * designAspectRatio;
                }
            }

            updateDimensionsUI(finalW, finalH, cfg.label);
        }

        function setAngle(ang) {
            currentAngle = ang;
            const img = document.getElementById('hoodie-img');
            img.src = imagesMap[ang];

            document.querySelectorAll('.angle-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('text-stone-300');
            });
            const activeBtn = document.getElementById('ang-' + ang);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-stone-300');
            }

            currentSizeIndex = (ang === 'back') ? 4 : 0;
            if (currentSizeIndex >= angleSizes[ang].length) currentSizeIndex = 0;

            renderSizesButtons();
            selectSize(currentSizeIndex);
        }

        function resetPosition() {
            const printBox = document.getElementById('print-box');
            const paperGuide = document.getElementById('paper-guide');
            printBox.classList.add('smooth-resize');
            const topPos = (currentAngle === 'back') ? '48%' : '40%';
            const leftPos = (currentAngle === 'side_right') ? '44%' : (currentAngle === 'side_left') ? '53%' : '49%';
            printBox.style.top = topPos;
            printBox.style.left = leftPos;
            paperGuide.style.top = topPos;
            paperGuide.style.left = leftPos;
        }

        function setColor(hex, name, isDark, btn) {
            currentColorName = name;
            currentColorHex = hex;
            document.getElementById('color-tint').style.backgroundColor = hex;
            
            const printBox = document.getElementById('print-box');
            if (isDark) printBox.classList.add('on-dark');
            else printBox.classList.remove('on-dark');

            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            btn.classList.add('active');
        }

        function uploadDesign(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const tempImg = new Image();
                tempImg.onload = function() {
                    designAspectRatio = tempImg.naturalWidth / tempImg.naturalHeight;
                    document.getElementById('print-img').src = e.target.result;
                    if (currentMode === 'presets') selectSize(currentSizeIndex);
                    else applyManualCm('w');
                };
                tempImg.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveDesignImage() {
            const canvas = document.createElement('canvas');
            const size = 1000;
            const footerHeight = 110;
            canvas.width = size;
            canvas.height = size + footerHeight;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const hoodieEl = document.getElementById('hoodie-img');
            const printEl = document.getElementById('print-img');
            const printBox = document.getElementById('print-box');

            ctx.drawImage(hoodieEl, 0, 0, size, size);

            if (currentColorHex !== 'transparent') {
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = currentColorHex;
                ctx.fillRect(0, 0, size, size);
                ctx.restore();
            }

            const leftPct = parseFloat(printBox.style.left) / 100;
            const topPct = parseFloat(printBox.style.top) / 100;
            const wPct = parseFloat(printBox.style.width) / 100;
            const hPct = parseFloat(printBox.style.height) / 100;

            const drawW = wPct * size;
            const drawH = hPct * size;
            const drawX = (leftPct * size) - (drawW / 2);
            const drawY = (topPct * size) - (drawH / 2);

            ctx.save();
            if (currentColorHex === 'transparent' || currentColorHex === '#d8cab3') {
                ctx.globalCompositeOperation = 'multiply';
            }
            ctx.drawImage(printEl, drawX, drawY, drawW, drawH);
            ctx.restore();

            ctx.fillStyle = '#181615';
            ctx.fillRect(0, size, size, footerHeight);
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, size);
            ctx.lineTo(size, size);
            ctx.stroke();

            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 30px Cairo, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`عِزوة | الجهة: ${angleNames[currentAngle]} — اللون: ${currentColorName}`, size - 35, size + 45);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Cairo, sans-serif';
            ctx.fillText(`صافي مقاس الطباعة: ${currentWcm} × ${currentHcm} سم`, size - 35, size + 88);

            const link = document.createElement('a');
            link.download = `EZWA-Hoodie-${currentAngle}-${currentWcm}x${currentHcm}cm.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function orderWhatsApp() {
            const faceName = angleNames[currentAngle];
            const cfg = angleSizes[currentAngle][currentSizeIndex];
            const modeText = currentMode === 'free' ? 'مقاس حر مخصص' : `${cfg.short}`;
            const posNote = customMoved ? ' (موضع مخصص)' : '';
            const text = `السلام عليكم، اعتمدت مقاس الطباعة على الهودي في المحاكي:\n- القطعة: هودي أوفر سايز\n- اللون: ${currentColorName}\n- الجهة: ${faceName}${posNote}\n- المقاس المختار: ${modeText}\n- صافي أبعاد التصميم: ${currentWcm} × ${currentHcm} سم`;
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        setAngle('front');

        const stage = document.getElementById('stage');
        const printBox = document.getElementById('print-box');
        const paperGuide = document.getElementById('paper-guide');
        let isDraggingPrint = false;
        let activeCorner = null;
        let isSwipingStage = false;
        let startX = 0;
        const anglesOrder = ['front', 'side_right', 'back', 'side_left'];

        document.querySelectorAll('.resize-handle').forEach(handle => {
            handle.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                activeCorner = handle.dataset.corner;
                printBox.classList.remove('smooth-resize');
                printBox.classList.add('dragging');
                if (currentMode !== 'free') switchMode('free');
            });
        });

        printBox.addEventListener('pointerdown', (e) => {
            if (activeCorner) return;
            e.stopPropagation();
            isDraggingPrint = true;
            printBox.classList.remove('smooth-resize');
            printBox.classList.add('dragging');
        });

        stage.addEventListener('pointerdown', (e) => {
            if (isDraggingPrint || activeCorner) return;
            isSwipingStage = true;
            startX = e.clientX;
        });

        window.addEventListener('pointermove', (e) => {
            const rect = stage.getBoundingClientRect();

            if (activeCorner) {
                const centerX = rect.left + (parseFloat(printBox.style.left) / 100) * rect.width;
                const centerY = rect.top + (parseFloat(printBox.style.top) / 100) * rect.height;

                const distX = Math.abs(e.clientX - centerX) * 2;
                const distY = Math.abs(e.clientY - centerY) * 2;

                const widthPercent = (distX / rect.width) * 100;
                const heightPercent = (distY / rect.height) * 100;

                let newWcm = widthPercent / CM_TO_PERCENT;
                let newHcm = heightPercent / CM_TO_PERCENT;

                if (lockAspectRatio) newHcm = newWcm / designAspectRatio;

                newWcm = Math.max(2.5, Math.min(32, newWcm));
                newHcm = Math.max(2.5, Math.min(42, newHcm));

                updateDimensionsUI(newWcm, newHcm, 'مقاس حر');
                return;
            }

            if (isDraggingPrint) {
                let xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                let yPercent = ((e.clientY - rect.top) / rect.height) * 100;

                xPercent = Math.max(15, Math.min(85, xPercent));
                yPercent = Math.max(15, Math.min(85, yPercent));

                printBox.style.left = xPercent + '%';
                printBox.style.top = yPercent + '%';
                paperGuide.style.left = xPercent + '%';
                paperGuide.style.top = yPercent + '%';
                customMoved = true;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (activeCorner) {
                activeCorner = null;
                printBox.classList.remove('dragging');
            }
            if (isDraggingPrint) {
                isDraggingPrint = false;
                printBox.classList.remove('dragging');
            }
            if (isSwipingStage) {
                isSwipingStage = false;
                const diff = e.clientX - startX;
                if (Math.abs(diff) > 35) {
                    let idx = anglesOrder.indexOf(currentAngle);
                    if (diff < 0) idx = (idx + 1) % 4;
                    else idx = (idx - 1 + 4) % 4;
                    setAngle(anglesOrder[idx]);
                }
            }
        });
    </script>
</body>
