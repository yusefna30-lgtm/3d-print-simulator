<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوديو المحاكاة والإنتاج | عِزوة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0d0d0d;
            color: #f5f5f4;
            margin: 0;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(24, 22, 21, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-accent { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; color: #121212; }
        .size-btn.active, .mode-btn.active, .prod-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
            border-color: #D4AF37;
        }
        .angle-btn.active {
            background-color: #D4AF37;
            color: #121212;
            font-weight: 700;
        }
        .angle-btn.has-saved {
            outline: 1.5px solid #34d399;
            outline-offset: -1px;
        }
        .color-dot.active {
            outline: 2px solid #D4AF37;
            outline-offset: 2px;
            transform: scale(1.15);
        }

        .mockup-stage {
            position: relative;
            width: min(74vw, 350px);
            height: min(35dvh, 320px);
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            background-color: #000000;
        }
        .stage-zoom-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.2s ease-out;
        }
        .stage-zoom-inner.no-anim {
            transition: none;
        }
        .garment-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .color-overlay {
            position: absolute;
            inset: 0;
            mix-blend-mode: multiply;
            pointer-events: none;
            transition: background-color 0.3s ease;
        }

        .print-layer {
            position: absolute;
            transform: translate(-50%, -50%);
            mix-blend-mode: multiply;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px dashed rgba(212, 175, 55, 0.85);
            background-color: rgba(212, 175, 55, 0.04);
            border-radius: 2px;
            z-index: 10;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .print-layer.smooth-resize {
            transition: width 0.25s ease, height 0.25s ease, top 0.25s ease, left 0.25s ease, border-color 0.2s ease;
        }
        .print-layer.dragging {
            border: 1.5px solid #D4AF37;
            background-color: rgba(212, 175, 55, 0.1);
        }
        .print-layer.on-dark, .print-layer.transparent-bg {
            mix-blend-mode: normal;
        }
        .print-layer.on-dark {
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
        }

        .print-layer.clean-view {
            border-color: transparent !important;
            background-color: transparent !important;
        }
        .print-layer.clean-view .resize-handle,
        .print-layer.clean-view .live-cm-badge {
            opacity: 0;
            pointer-events: none;
        }

        .resize-handle {
            position: absolute;
            width: 13px;
            height: 13px;
            background-color: #D4AF37;
            border: 2px solid #121212;
            border-radius: 50%;
            z-index: 30;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .resize-handle:hover, .resize-handle:active {
            transform: scale(1.3);
            background-color: #ffffff;
        }
        .handle-nw { top: -6.5px; left: -6.5px; cursor: nwse-resize; }
        .handle-ne { top: -6.5px; right: -6.5px; cursor: nesw-resize; }
        .handle-sw { bottom: -6.5px; left: -6.5px; cursor: nesw-resize; }
        .handle-se { bottom: -6.5px; right: -6.5px; cursor: nwse-resize; }

        .live-cm-badge {
            position: absolute;
            top: -23px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.94);
            color: #D4AF37;
            border: 1px solid rgba(212, 175, 55, 0.6);
            padding: 0px 6px;
            border-radius: 5px;
            font-size: 9.5px;
            font-weight: 700;
            white-space: nowrap;
            pointer-events: none;
            direction: ltr;
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body class="w-screen flex flex-col justify-between items-center relative">

    <header class="w-full px-3 pt-2 pb-1 flex flex-wrap justify-between items-center gap-1.5 z-20 shrink-0">
        <div class="flex items-center gap-1.5">
            <div class="glass-panel px-2.5 py-1 rounded-xl flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg gold-bg flex items-center justify-center font-black text-xs">عِزوة</div>
                <div class="hidden sm:block">
                    <h1 class="text-xs font-bold text-white leading-tight">استوديو الطباعة</h1>
                    <p class="text-[9px] text-stone-400">معاينة وإنتاج</p>
                </div>
            </div>

            <div class="glass-panel p-1 rounded-xl flex gap-1">
                <button id="prod-hoodie" onclick="setProduct('hoodie')" class="prod-btn active px-2.5 py-1 rounded-lg text-[11px] transition">هودي</button>
                <button id="prod-tshirt" onclick="setProduct('tshirt')" class="prod-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">تيشيرت بوكسي</button>
            </div>
        </div>

        <div class="glass-panel p-1 rounded-xl flex gap-1">
            <button id="ang-front" onclick="setAngle('front')" class="angle-btn active px-2 py-1 rounded-lg text-[11px] transition">الأمام</button>
            <button id="ang-side_right" onclick="setAngle('side_right')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يمين</button>
            <button id="ang-back" onclick="setAngle('back')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">الظهر</button>
            <button id="ang-side_left" onclick="setAngle('side_left')" class="angle-btn px-2 py-1 rounded-lg text-[11px] text-stone-300 transition">كم يسار</button>
        </div>
    </header>

    <main id="main-area" class="flex-1 flex flex-col items-center justify-center w-full relative z-10 pr-2.5 pl-12 sm:px-4 min-h-0">
        
        <div id="dpi-banner" class="mb-1 px-3 py-0.5 rounded-full glass-panel flex items-center gap-1.5 text-[10px]">
            <span id="dpi-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span id="dpi-text" class="text-stone-200 font-semibold">جودة التصميم: ممتازة للطباعة (300 DPI)</span>
            <span id="zoom-indicator" class="hidden mr-1 px-1.5 py-0.2 rounded bg-[#D4AF37]/20 text-[#D4AF37] font-bold" dir="ltr">1.5x</span>
            <span id="saved-angles-badge" class="hidden mr-1 px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300 font-bold">0 محفوظ</span>
        </div>

        <div id="stage" class="mockup-stage cursor-grab active:cursor-grabbing">
            <div id="zoom-inner" class="stage-zoom-inner">
                <img id="garment-img" src="front.jpg.jpg" alt="القطعة" class="garment-img">
                <div id="color-tint" class="color-overlay" style="background-color: transparent;"></div>
                
                <div id="print-box" class="print-layer smooth-resize" style="top: 34%; left: 57%; width: 9.2%; height: 9.2%;">
                    <div id="live-badge" class="live-cm-badge">8.0 × 8.0 cm</div>
                    <img id="print-img" src="" alt="التصميم" class="w-full h-full object-contain pointer-events-none">
                    
                    <div class="resize-handle handle-nw" data-corner="nw"></div>
                    <div class="resize-handle handle-ne" data-corner="ne"></div>
                    <div class="resize-handle handle-sw" data-corner="sw"></div>
                    <div class="resize-handle handle-se" data-corner="se"></div>
                </div>
            </div>
        </div>

        <div class="mt-1.5 w-full max-w-md grid grid-cols-4 gap-1">
            <button id="btn-stage-zoom" onclick="cycleStageZoom()" class="glass-panel py-1 px-1 rounded-lg text-[9.5px] font-bold text-stone-200 flex items-center justify-center gap-0.5 transition truncate">
                <span>🔍</span>
                <span id="zoom-btn-text">تكبير</span>
            </button>

            <button id="btn-remove-bg" onclick="toggleRemoveWhiteBg()" class="glass-panel py-1 px-1 rounded-lg text-[9.5px] font-bold text-stone-200 flex items-center justify-center gap-0.5 transition truncate">
                <span>✨</span>
                <span id="bg-btn-text">تفريغ</span>
            </button>

            <button id="btn-lock-ratio" onclick="toggleRatioLock()" class="glass-panel py-1 px-1 rounded-lg text-[9.5px] font-bold gold-accent border-[#D4AF37] flex items-center justify-center gap-0.5 transition truncate">
                <span id="lock-icon">🔒</span>
                <span id="lock-text">تناسب</span>
            </button>

            <button onclick="resetPosition()" class="glass-panel py-1 px-1 rounded-lg text-[9.5px] font-bold text-stone-200 flex items-center justify-center gap-0.5 transition truncate">
                <span>↺</span>
                <span>توسيط</span>
            </button>
        </div>

        <div class="mt-1 w-full max-w-md grid grid-cols-3 gap-1.5">
            <button id="btn-save-angle" onclick="saveCurrentAngle()" class="col-span-2 py-1 px-2.5 rounded-xl glass-panel border border-emerald-400/50 text-emerald-300 font-bold text-[10px] flex items-center justify-center gap-1 hover:bg-emerald-950/40 transition truncate">
                <span id="save-angle-icon">💾</span>
                <span id="save-angle-text">حفظ تصميم الجهة</span>
            </button>

            <button id="btn-clear-saved" onclick="clearSavedAngles()" class="col-span-1 py-1 px-2 rounded-xl glass-panel border border-rose-500/40 text-rose-300 font-bold text-[10px] flex items-center justify-center gap-1 hover:bg-rose-950/40 transition truncate">
                <span>🗑</span>
                <span>مسح المحفوظات</span>
            </button>
        </div>

        <div class="fixed left-2 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-1.5">
            <label class="glass-panel p-1.5 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#D4AF37] transition text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 sm:h-4 sm:w-4 gold-accent mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span class="text-[8px] font-bold text-white leading-tight">ارفع<br>تصميمك</span>
                <input type="file" accept="image/*" class="hidden" onchange="uploadDesign(event)">
            </label>

            <div class="glass-panel p-1 rounded-xl flex flex-col items-center gap-1">
                <span class="text-[8.5px] text-stone-400">اللون</span>
                <button onclick="setColor('transparent', 'أبيض', false, this)" class="color-dot active w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-[#ffffff] border border-stone-500 transition" title="أبيض"></button>
                <button onclick="setColor('#262629', 'أسود مطفي', true, this)" class="color-dot w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-[#18181b] border border-stone-500 transition" title="أسود"></button>
                <button onclick="setColor('#5e192c', 'عنابي داكن', true, this)" class="color-dot w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-[#4a1525] border border-stone-500 transition" title="عنابي"></button>
                <button onclick="setColor('#d8cab3', 'بيج رملي', false, this)" class="color-dot w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-[#d6cbb8] border border-stone-500 transition" title="بيج"></button>
                <button onclick="setColor('#3b473c', 'زيتي داكن', true, this)" class="color-dot w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-[#2d362e] border border-stone-500 transition" title="زيتي"></button>
            </div>
        </div>
    </main>

    <footer class="w-full px-3 pb-2 pt-1 z-20 shrink-0">
        <div class="max-w-2xl mx-auto glass-panel rounded-2xl p-2 sm:p-2.5 shadow-2xl">
            
            <div class="flex flex-wrap justify-between items-center gap-1.5 mb-1.5">
                <div class="flex bg-black/50 p-0.5 rounded-xl border border-stone-800">
                    <button id="tab-presets" onclick="switchMode('presets')" class="mode-btn active px-2.5 py-1 rounded-lg text-[11px] transition">مقاسات المطابع</button>
                    <button id="tab-free" onclick="switchMode('free')" class="mode-btn px-2.5 py-1 rounded-lg text-[11px] text-stone-300 transition">مقاس حر (سحب الزوايا)</button>
                </div>

                <div class="flex items-center gap-1.5 bg-black/40 px-2.5 py-1 rounded-lg border border-stone-800">
                    <span id="paper-name-label" class="text-[10.5px] text-stone-300">شعار صدر:</span>
                    <span id="size-label" class="text-[11px] gold-accent font-bold" dir="ltr">8.0 × 8.0 cm</span>
                </div>
            </div>

            <div id="presets-panel">
                <div id="sizes-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 mb-2"></div>
            </div>

            <div id="free-panel" class="hidden mb-2 bg-black/40 p-2 rounded-xl border border-stone-800">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                    <p class="text-[10.5px] text-stone-300">اسحب زوايا التصميم أو أدخل المقاس بالسنتيمتر:</p>
                    <div class="flex items-center gap-2" dir="ltr">
                        <div class="flex items-center gap-1">
                            <input id="input-w-cm" type="number" step="0.5" min="2" max="35" value="8" onchange="applyManualCm('w')" class="w-14 bg-stone-900 border border-stone-700 rounded-lg px-1.5 py-1 text-center text-xs text-white focus:border-[#D4AF37] outline-none">
                            <span class="text-[10px] text-stone-400">W</span>
                        </div>
                        <span class="text-stone-500 text-xs">×</span>
                        <div class="flex items-center gap-1">
                            <input id="input-h-cm" type="number" step="0.5" min="2" max="45" value="8" onchange="applyManualCm('h')" class="w-14 bg-stone-900 border border-stone-700 rounded-lg px-1.5 py-1 text-center text-xs text-white focus:border-[#D4AF37] outline-none">
                            <span class="text-[10px] text-stone-400">H (cm)</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button id="btn-prod-sheet" onclick="saveProductionSheet()" class="col-span-1 py-2 px-2 rounded-xl bg-stone-800 border border-[#D4AF37]/60 text-[#D4AF37] font-bold text-[11px] sm:text-xs flex items-center justify-center gap-1 hover:bg-stone-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span id="prod-sheet-label">ملف الإنتاج</span>
                </button>

                <button onclick="orderWhatsApp()" class="col-span-2 py-2 px-3 rounded-xl gold-bg font-bold text-xs sm:text-sm flex items-center justify-center gap-2 hover:opacity-95 transition">
                    <span>اعتماد المقاس والطلب عبر واتساب</span>
                </button>
            </div>
        </div>
    </footer>

    <script>
        let hasUserUploadedDesign = false;
        let designAspectRatio = 1.0;
        let lockAspectRatio = true;
        let isBgRemoved = false;
        let originalDesignDataUrl = '';
        let transparentDesignDataUrl = '';
        let designNaturalW = 1200;
        let designNaturalH = 1200;

        const savedAnglesState = {};

        const zoomLevels = [1, 1.5, 2.2];
        let zoomIdx = 0;
        let panX = 0;
        let panY = 0;

        function loadImageSafe(src, fallbackSrc) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => {
                    if (fallbackSrc && fallbackSrc !== src) {
                        const fb = new Image();
                        fb.crossOrigin = 'anonymous';
                        fb.onload = () => resolve(fb);
                        fb.onerror = () => resolve(null);
                        fb.src = fallbackSrc;
                    } else {
                        resolve(null);
                    }
                };
                img.src = src;
            });
        }

        function applyStageTransform() {
            const scale = zoomLevels[zoomIdx];
            const inner = document.getElementById('zoom-inner');
            const badge = document.getElementById('zoom-indicator');
            const btn = document.getElementById('btn-stage-zoom');
            const btnTxt = document.getElementById('zoom-btn-text');

            const maxPan = ((scale - 1) * 140);
            panX = Math.max(-maxPan, Math.min(maxPan, panX));
            panY = Math.max(-maxPan, Math.min(maxPan, panY));

            inner.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;

            if (scale > 1) {
                badge.innerText = `${scale}x`;
                badge.classList.remove('hidden');
                btn.classList.add('border-[#D4AF37]', 'gold-accent');
                btnTxt.innerText = `${scale}x`;
            } else {
                panX = 0;
                panY = 0;
                inner.style.transform = 'translate(0px, 0px) scale(1)';
                badge.classList.add('hidden');
                btn.classList.remove('border-[#D4AF37]', 'gold-accent');
                btnTxt.innerText = 'تكبير';
            }
        }

        function cycleStageZoom() {
            zoomIdx = (zoomIdx + 1) % zoomLevels.length;
            if (zoomIdx === 0) {
                panX = 0;
                panY = 0;
            }
            applyStageTransform();
        }

        function generateTshirtFallback(angle) {
            const c = document.createElement('canvas');
            c.width = 600; c.height = 600;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 600, 600);

            ctx.fillStyle = '#f2f2f2';
            ctx.beginPath();
            if (angle === 'front' || angle === 'back') {
                ctx.moveTo(220, 110);
                ctx.lineTo(380, 110);
                ctx.lineTo(520, 175);
                ctx.lineTo(485, 290);
                ctx.lineTo(425, 265);
                ctx.lineTo(425, 510);
                ctx.lineTo(175, 510);
                ctx.lineTo(175, 265);
                ctx.lineTo(115, 290);
                ctx.lineTo(80, 175);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#d4d4d4';
                ctx.lineWidth = 8;
                ctx.beginPath();
                if (angle === 'front') ctx.arc(300, 112, 52, 0.1 * Math.PI, 0.9 * Math.PI);
                else ctx.arc(300, 110, 52, 0.05 * Math.PI, 0.95 * Math.PI);
                ctx.stroke();
            } else {
                ctx.moveTo(240, 115);
                ctx.lineTo(360, 115);
                ctx.lineTo(395, 280);
                ctx.lineTo(375, 510);
                ctx.lineTo(225, 510);
                ctx.lineTo(205, 280);
                ctx.closePath();
                ctx.fill();
            }
            return c.toDataURL();
        }

        function initDefaultLogo() {
            const c = document.createElement('canvas');
            c.width = 1200; c.height = 1200;
            const ctx = c.getContext('2d');
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 42;
            ctx.strokeRect(48, 48, 1104, 1104);
            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 260px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('عِـزوة', 600, 520);
            ctx.font = 'bold 95px Cairo, sans-serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('EZWA STUDIO', 600, 780);
            originalDesignDataUrl = c.toDataURL();
            document.getElementById('print-img').src = originalDesignDataUrl;
        }
        initDefaultLogo();

        let currentProduct = 'hoodie';
        let currentAngle = 'front';
        let currentSizeIndex = 0;
        let currentColorName = 'أبيض';
        let currentColorHex = 'transparent';
        let currentMode = 'presets';
        let customMoved = false;

        let currentWcm = 8.0;
        let currentHcm = 8.0;

        const CM_TO_PERCENT = 1.15;

        const productImages = {
            hoodie: {
                front:      'front.jpg.jpg',
                side_right: 'side_right.jpg.jpg',
                back:       'back.jpg.jpg',
                side_left:  'side_left.jpg.jpg'
            },
            tshirt: {
                front:      'tshirt_front.jpg.jpg',
                side_right: 'tshirt_side_right.jpg.jpg',
                back:       'tshirt_back.jpg.jpg',
                side_left:  'tshirt_side_left.jpg.jpg'
            }
        };

        const productNames = {
            hoodie: 'هودي أوفر سايز',
            tshirt: 'تيشيرت بوكسي فيت'
        };

        const angleNames = {
            front:      'الأمام (الصدر)',
            side_right: 'الكم الأيمن',
            back:       'الخلف (الظهر)',
            side_left:  'الكم الأيسر'
        };

        const shortAngleNames = {
            front:      'الصدر',
            side_right: 'الكم اليمين',
            back:       'الظهر',
            side_left:  'الكم اليسار'
        };

        const productSizes = {
            hoodie: {
                front: [
                    { short: 'شعار صدر (8 × 8 سم)',   label: 'شعار صدر',     top: '34%', left: '57%', maxW: 8,    maxH: 8 },
                    { short: 'شعار بارز (10 × 10 سم)', label: 'شعار بارز',     top: '34%', left: '57%', maxW: 10,   maxH: 10 },

        function checkPrintDPI() {
            const wInches = currentWcm / 2.54;
            const hInches = currentHcm / 2.54;
            const dpiW = designNaturalW / wInches;
            const dpiH = designNaturalH / hInches;
            const effectiveDpi = Math.round(Math.min(dpiW, dpiH));

            const dot = document.getElementById('dpi-dot');
            const txt = document.getElementById('dpi-text');

            if (effectiveDpi >= 200) {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                txt.innerText = `جودة التصميم: ممتازة للطباعة (${Math.min(300, effectiveDpi)} DPI)`;
                txt.className = 'text-stone-200 font-semibold';
            } else if (effectiveDpi >= 120) {
                dot.className = 'w-2 h-2 rounded-full bg-amber-400';
                txt.innerText = `جودة متوسطة (${effectiveDpi} DPI) — مقبولة لطباعة DTF`;
                txt.className = 'text-amber-300 font-semibold';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                txt.innerText = `تنبيه: دقة الصورة منخفضة (${effectiveDpi} DPI) لهذا المقاس الكبير`;
                txt.className = 'text-rose-300 font-semibold';
            }
        }

        function toggleRemoveWhiteBg() {
            const btn = document.getElementById('btn-remove-bg');
            const txt = document.getElementById('bg-btn-text');
            const printBox = document.getElementById('print-box');
            const printImg = document.getElementById('print-img');

            isBgRemoved = !isBgRemoved;

            if (isBgRemoved) {
                btn.classList.add('border-[#D4AF37]', 'gold-accent');
                txt.innerText = 'مفرّغ';
                printBox.classList.add('transparent-bg');

                const tempImg = new Image();
                tempImg.crossOrigin = 'anonymous';
                tempImg.onload = function() {
                    const c = document.createElement('canvas');
                    c.width = tempImg.naturalWidth;
                    c.height = tempImg.naturalHeight;
                    const ctx = c.getContext('2d');
                    ctx.drawImage(tempImg, 0, 0);
                    const imgData = ctx.getImageData(0, 0, c.width, c.height);
                    const d = imgData.data;

                    for (let i = 0; i < d.length; i += 4) {
                        const r = d[i], g = d[i + 1], b = d[i + 2];
                        if (r > 235 && g > 235 && b > 235) {
                            d[i + 3] = 0;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                    transparentDesignDataUrl = c.toDataURL('image/png');
                    printImg.src = transparentDesignDataUrl;
                };
                tempImg.src = originalDesignDataUrl;
            } else {
                btn.classList.remove('border-[#D4AF37]', 'gold-accent');
                txt.innerText = 'تفريغ';
                printBox.classList.remove('transparent-bg');
                printImg.src = originalDesignDataUrl;
            }
        }

        async function drawSingleAngleCard(ctx, item, x, y, w, h) {
            ctx.fillStyle = '#181615';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = 'rgba(212,175,55,0.45)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);

            const stageSize = Math.min(w - 40, h - 135);
            const stageX = x + (w - stageSize) / 2;
            const stageY = y + 18;

            ctx.fillStyle = '#000000';
            ctx.fillRect(stageX, stageY, stageSize, stageSize);

            const fallbackSrc = currentProduct === 'tshirt' ? generateTshirtFallback(item.angle) : null;
            const [angleImg, artImg] = await Promise.all([
                loadImageSafe(productImages[currentProduct][item.angle], fallbackSrc),
                loadImageSafe(item.imgSrc, null)
            ]);

            if (angleImg) {
                ctx.drawImage(angleImg, stageX, stageY, stageSize, stageSize);
            }

            if (item.colorHex !== 'transparent') {
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = item.colorHex;
                ctx.fillRect(stageX, stageY, stageSize, stageSize);
                ctx.restore();
            }

            const leftPct = parseFloat(item.left) / 100;
            const topPct = parseFloat(item.top) / 100;
            const wPct = parseFloat(item.width) / 100;
            const hPct = parseFloat(item.height) / 100;

            const drawW = wPct * stageSize;
            const drawH = hPct * stageSize;
            const drawX = stageX + (leftPct * stageSize) - (drawW / 2);
            const drawY = stageY + (topPct * stageSize) - (drawH / 2);

            if (artImg) {
                ctx.save();
                if (!item.isBgRemoved && (item.colorHex === 'transparent' || item.colorHex === '#d8cab3')) {
                    ctx.globalCompositeOperation = 'multiply';
                }
                ctx.drawImage(artImg, drawX, drawY, drawW, drawH);
                ctx.restore();
            }

            ctx.direction = 'rtl';
            ctx.textAlign = 'right';
            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 23px Cairo, sans-serif';
            ctx.fillText(`${item.angleLabel} — ${item.wCm} × ${item.hCm} سم`, x + w - 22, stageY + stageSize + 38);

            ctx.fillStyle = '#d6d3d1';
            ctx.font = '17px Cairo, sans-serif';
            ctx.fillText(`اللون: ${item.colorName} | المقاس: ${item.sizeShort}`, x + w - 22, stageY + stageSize + 72);
        }

        async function saveProductionSheet() {
            const orderKeys = ['front', 'side_right', 'back', 'side_left'].filter(k => Boolean(savedAnglesState[k]));
            const items = orderKeys.length > 0 ? orderKeys.map(k => savedAnglesState[k]) : [buildAngleSnapshot(currentAngle)];

            const cols = items.length > 1 ? 2 : 1;
            const rows = Math.ceil(items.length / cols);
            const cardW = 560;
            const cardH = 620;
            const gap = 24;

            const canvasW = cols === 2 ? (cardW * 2 + gap * 3) : 1200;
            const summaryH = 210;
            const headerH = 105;
            const canvasH = headerH + (rows * cardH) + ((rows + 1) * gap) + summaryH;

            const canvas = document.createElement('canvas');
            canvas.width = canvasW;
            canvas.height = canvasH;
            const ctx = canvas.getContext('2d');
            ctx.direction = 'rtl';

            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, canvasW, canvasH);

            ctx.fillStyle = '#181615';
            ctx.fillRect(0, 0, canvasW, headerH);
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, headerH); ctx.lineTo(canvasW, headerH); ctx.stroke();

            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 32px Cairo, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`عِزوة | ملف الإنتاج المكتمل (${items.length} ${items.length > 1 ? 'جهات' : 'جهة'})`, canvasW - 32, 65);

            for (let idx = 0; idx < items.length; idx++) {
                const item = items[idx];
                const cIdx = idx % cols;
                const rIdx = Math.floor(idx / cols);
                const x = cols === 2 ? (gap + cIdx * (cardW + gap)) : ((canvasW - cardW) / 2);
                const y = headerH + gap + rIdx * (cardH + gap);
                await drawSingleAngleCard(ctx, item, x, y, cardW, cardH);
            }

            const sumY = headerH + gap + rows * (cardH + gap);
            ctx.fillStyle = '#181615';
            ctx.fillRect(gap, sumY, canvasW - gap * 2, 175);
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 2;
            ctx.strokeRect(gap, sumY, canvasW - gap * 2, 175);

            ctx.direction = 'rtl';
            ctx.textAlign = 'right';
            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 24px Cairo, sans-serif';
            ctx.fillText(`القطعة: ${productNames[currentProduct]} | اللون: ${currentColorName} | الطباعة: DTF`, canvasW - gap - 24, sumY + 48);

            ctx.fillStyle = '#f5f5f4';
            ctx.font = '20px Cairo, sans-serif';
            const dimsSummary = items.map(i => `${i.angleLabel}: (${i.wCm}×${i.hCm} سم)`).join('  •  ');
            ctx.fillText(`الأبعاد المعتمدة: ${dimsSummary}`, canvasW - gap - 24, sumY + 95);

            ctx.fillStyle = '#a8a29e';
            ctx.font = '18px Cairo, sans-serif';
            ctx.fillText(`تفريغ الخلفية: ${isBgRemoved ? 'مفعل (شفاف)' : 'أصلي'}  |  الدقة: ${document.getElementById('dpi-text').innerText.split('(')[1]?.replace(')', '') || '300 DPI'}`, canvasW - gap - 24, sumY + 138);

            const link = document.createElement('a');
            const tagName = items.length > 1 ? `Complete-${items.length}sides` : `${currentAngle}-${currentWcm}x${currentHcm}cm`;
            link.download = `EZWA-Production-${currentProduct}-${tagName}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function orderWhatsApp() {
            const orderKeys = ['front', 'side_right', 'back', 'side_left'].filter(k => Boolean(savedAnglesState[k]));
            const items = orderKeys.length > 0 ? orderKeys.map(k => savedAnglesState[k]) : [buildAngleSnapshot(currentAngle)];
            const prodName = productNames[currentProduct];
            const bgNote = isBgRemoved ? ' (مع تفريغ الخلفية)' : '';

            const lines = items.map(i => `• ${i.angleLabel}: ${i.sizeShort} (${i.wCm} × ${i.hCm} سم)${i.customMoved ? ' - موضع مخصص' : ''}`).join('\n');
            const text = `السلام عليكم، اعتمدت طلب الطباعة في الاستوديو:\n- القطعة: ${prodName}\n- اللون: ${currentColorName}${bgNote}\n- الجهات والمقاسات:\n${lines}`;
            const url = `https://wa.me/966502777884?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        setAngle('front');

        (function loadDesignFromCatalog() {
            const params = new URLSearchParams(window.location.search);
            const designUrl = params.get('design');
            if (designUrl) {
                applyLoadedDesign(designUrl);
            }
        })();

        const stage = document.getElementById('stage');
        const mainArea = document.getElementById('main-area');
        const printBox = document.getElementById('print-box');
        const zoomInner = document.getElementById('zoom-inner');
        let isDraggingPrint = false;
        let activeCorner = null;
        let isPanningStage = false;
        let isSwipingStage = false;
        let startX = 0;
        let startY = 0;
        let panOriginX = 0;
        let panOriginY = 0;
        const anglesOrder = ['front', 'side_right', 'back', 'side_left'];

        document.querySelectorAll('.resize-handle').forEach(handle => {
            handle.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                setPrintSelected(true);
                activeCorner = handle.dataset.corner;
                printBox.classList.remove('smooth-resize');
                printBox.classList.add('dragging');
                if (currentMode !== 'free') switchMode('free');
            });
        });

        printBox.addEventListener('pointerdown', (e) => {
            if (activeCorner) return;
            e.stopPropagation();
            setPrintSelected(true);
            isDraggingPrint = true;
            printBox.classList.remove('smooth-resize');
            printBox.classList.add('dragging');
        });

        stage.addEventListener('pointerdown', (e) => {
            if (isDraggingPrint || activeCorner) return;
            setPrintSelected(false);
            if (zoomLevels[zoomIdx] > 1) {
                isPanningStage = true;
                zoomInner.classList.add('no-anim');
                startX = e.clientX;
                startY = e.clientY;
                panOriginX = panX;
                panOriginY = panY;
            } else {
                isSwipingStage = true;
                startX = e.clientX;
            }
        });

        mainArea.addEventListener('pointerdown', (e) => {
            if (e.target === mainArea) setPrintSelected(false);
        });

        window.addEventListener('pointermove', (e) => {
            const rect = stage.getBoundingClientRect();
            const scale = zoomLevels[zoomIdx];

            if (isPanningStage) {
                panX = panOriginX + (e.clientX - startX);
                panY = panOriginY + (e.clientY - startY);
                const maxPan = ((scale - 1) * 140);
                panX = Math.max(-maxPan, Math.min(maxPan, panX));
                panY = Math.max(-maxPan, Math.min(maxPan, panY));
                zoomInner.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
                return;
            }

            if (activeCorner) {
                const centerX = rect.left + (parseFloat(printBox.style.left) / 100) * rect.width;
                const centerY = rect.top + (parseFloat(printBox.style.top) / 100) * rect.height;

                const distX = Math.abs(e.clientX - centerX) * 2;
                const distY = Math.abs(e.clientY - centerY) * 2;

                const widthPercent = (distX / rect.width) * 100;
                const heightPercent = (distY / rect.height) * 100;

                let newWcm = widthPercent / CM_TO_PERCENT;
                let newHcm = heightPercent / CM_TO_PERCENT;

                if (lockAspectRatio && hasUserUploadedDesign) {
                    newHcm = newWcm / designAspectRatio;
                }

                newWcm = Math.max(2.5, Math.min(32, newWcm));
                newHcm = Math.max(2.5, Math.min(42, newHcm));

                updateDimensionsUI(newWcm, newHcm, 'مقاس حر');
                return;
            }

            if (isDraggingPrint) {
                let xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                let yPercent = ((e.clientY - rect.top) / rect.height) * 100;

                xPercent = Math.max(15, Math.min(85, xPercent));
                yPercent = Math.max(15, Math.min(85, yPercent));

                printBox.style.left = xPercent + '%';
                printBox.style.top = yPercent + '%';
                customMoved = true;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (isPanningStage) {
                isPanningStage = false;
                zoomInner.classList.remove('no-anim');
            }
            if (activeCorner) {
                activeCorner = null;
                printBox.classList.remove('dragging');
            }
            if (isDraggingPrint) {
                isDraggingPrint = false;
                printBox.classList.remove('dragging');
            }
            if (isSwipingStage) {
                isSwipingStage = false;
                const diff = e.clientX - startX;
                if (Math.abs(diff) > 35) {
                    let idx = anglesOrder.indexOf(currentAngle);
                    if (diff < 0) idx = (idx + 1) % 4;
                    else idx = (idx - 1 + 4) % 4;
                    setAngle(anglesOrder[idx]);
                }
            }
        });
    </script>
</body>
</html>
